<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوبر ماركت المدينة</title>
  <style>
    :root {
      --green: #16803c;
      --green-dark: #0e5a2a;
      --green-soft: #edf9f0;
      --orange: #ffb347;
      --text: #1b2a1f;
      --muted: #587062;
      --bg: #f5f7f5;
      --card: #ffffff;
      --border: #dfe7df;
      --shadow: 0 12px 32px rgba(18, 58, 32, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", "Tahoma", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--green-dark);
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 700;
    }

    .nav a:hover { color: var(--green-dark); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      min-width: 240px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      color: var(--text);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      background: var(--green);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button.secondary {
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid rgba(22, 128, 60, 0.15);
    }

    .button.danger {
      background: #e14b4b;
      color: white;
      border: 1px solid rgba(225, 75, 75, 0.2);
    }

    .hero {
      padding: 28px 0 16px;
    }

    .hero-wrap {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      align-items: center;
      background: linear-gradient(135deg, #edf9f0, #fdfdfd);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      background: #eaf7ee;
      color: var(--green-dark);
      border: 1px solid rgba(22, 128, 60, 0.15);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(2.1rem, 3vw, 3.2rem);
      line-height: 1.25;
      margin: 0 0 12px;
      color: var(--green-dark);
    }

    .hero p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 700;
    }

    .stats strong { color: var(--text); display: block; font-size: 1.4rem; }

    .hero-card {
      background: linear-gradient(180deg, #ffffff, #f0fbf3);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .mini-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .mini-box:last-child { margin-bottom: 0; }

    .mini-box h3 {
      margin: 0 0 8px;
      color: var(--green-dark);
      font-size: 1.05rem;
    }

    .mini-box .price {
      font-size: 1.8rem;
      color: var(--text);
      font-weight: 900;
    }

    .mini-box .old {
      color: var(--muted);
      text-decoration: line-through;
      margin-right: 8px;
    }

    .section {
      padding: 26px 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.2rem);
      color: var(--green-dark);
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--green-dark);
      border-color: var(--green-dark);
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f8f1, #f8faf8);
      font-size: 3.2rem;
    }

    .product-body {
      padding: 16px;
    }

    .product-name {
      margin: 0 0 8px;
      font-size: 1.05rem;
      color: var(--text);
      min-height: 48px;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #edf7ee;
      color: var(--green-dark);
    }

    .price {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--green-dark);
    }

    .product-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .stock {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      margin-top: 18px;
    }

    .admin-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .product-form {
      background: #f8faf8;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .product-form label {
      display: grid;
      gap: 8px;
      font-weight: 700;
      color: var(--muted);
    }

    .product-form input {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .admin-products-list {
      display: grid;
      gap: 10px;
    }

    .admin-product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #f8faf8;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .admin-product-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .admin-product-emoji {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: #edf9f0;
    }

    .admin-product-meta {
      min-width: 0;
    }

    .admin-product-meta strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .admin-product-meta span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .admin-product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .footer {
      background: #0f2018;
      color: rgba(255,255,255,0.8);
      padding: 26px 0;
      margin-top: 40px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 840px) {
      .hero-wrap { grid-template-columns: 1fr; }
      .topbar-inner { flex-direction: column; align-items: stretch; }
      .nav { justify-content: center; }
      .header-actions { justify-content: center; }
      .search-box { min-width: 0; width: 100%; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-product-row { flex-direction: column; align-items: stretch; }
      .admin-product-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        المدينة
        <small>سوبر ماركت</small>
      </div>

      <nav class="nav">
        <a href="index.html">الرئيسية</a>
        <a href="admin.html">لوحة الإدارة</a>
      </nav>

      <div class="header-actions">
        <button class="button secondary" type="button" onclick="location.href='index.html'">العودة للمتجر</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container admin-panel">
        <div class="section-head">
          <h2>لوحة إدارة المنتجات</h2>
        </div>

        <div class="admin-layout">
          <form id="productForm" class="product-form">
            <input id="productId" type="hidden" />

            <label>
              اسم المنتج
              <input id="productName" type="text" placeholder="مثال: لبن طويل الأمد" required />
            </label>

            <label>
              السعر (ر.س)
              <input id="productPrice" type="number" min="0" step="0.01" placeholder="12.50" required />
            </label>

            <label>
              المخزون
              <input id="productStock" type="number" min="0" step="1" placeholder="20" required />
            </label>

            <label>
              رمز المنتج
              <input id="productEmoji" type="text" maxlength="2" placeholder="🥤" />
            </label>

            <div class="form-actions">
              <button id="saveProductBtn" class="button" type="submit">حفظ المنتج</button>
              <button id="cancelEditBtn" class="button secondary" type="button">إلغاء</button>
            </div>
          </form>

          <div>
            <div class="section-head" style="margin-bottom: 12px;">
              <h2 style="font-size: 1.4rem;">قائمة المنتجات</h2>
            </div>
            <div id="adminProductsList" class="admin-products-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <strong>السوق المدينة</strong><br />
        متجر يومي يوفر كل احتياجات العائلة.
      </div>
      <div>واتساب: 966500000000+</div>
      <div>العنوان: المدينة المنورة</div>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'md_products';
    const defaultProducts = [
      { id: 1, name: 'كوكاكولا 1.25 لتر', price: 8.5, stock: 40, emoji: '🥤' },
      { id: 2, name: 'مياه معدنية 1.5 لتر', price: 1.5, stock: 200, emoji: '💧' },
      { id: 3, name: 'عصير برتقال 1 لتر', price: 6, stock: 3, emoji: '🍊' },
      { id: 4, name: 'أرز بسمتي 5 كيلو', price: 32, stock: 25, emoji: '🍚' },
      { id: 5, name: 'مكرونة سباغيتي 500 جرام', price: 2.5, stock: 120, emoji: '🍝' },
      { id: 6, name: 'سكر أبيض 1 كيلو', price: 3.5, stock: 80, emoji: '🍬' },
      { id: 7, name: 'زيت دوار الشمس 1.8 لتر', price: 18, stock: 0, emoji: '🫒' }
    ];

    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultProducts;

    const productForm = document.getElementById('productForm');
    const productIdInput = document.getElementById('productId');
    const productNameInput = document.getElementById('productName');
    const productPriceInput = document.getElementById('productPrice');
    const productStockInput = document.getElementById('productStock');
    const productEmojiInput = document.getElementById('productEmoji');
    const adminProductsList = document.getElementById('adminProductsList');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function resetForm() {
      productForm.reset();
      productIdInput.value = '';
      document.getElementById('saveProductBtn').textContent = 'حفظ المنتج';
    }

    function renderAdminProducts() {
      if (!adminProductsList) return;

      if (!products.length) {
        adminProductsList.innerHTML = '<div class="empty-state" style="padding:20px; color:#587062; background:#f8faf8; border:1px solid var(--border); border-radius:14px;">لا توجد منتجات حتى الآن.</div>';
        return;
      }

      adminProductsList.innerHTML = products.map(product => `
        <div class="admin-product-row">
          <div class="admin-product-info">
            <div class="admin-product-emoji">${product.emoji || '🛒'}</div>
            <div class="admin-product-meta">
              <strong>${product.name}</strong>
              <span>${Number(product.price).toFixed(2)} ر.س • المخزون: ${product.stock}</span>
            </div>
          </div>
          <div class="admin-product-actions">
            <button class="button secondary" type="button" data-edit-id="${product.id}">تعديل الاسم</button>
            <button class="button danger" type="button" data-delete-id="${product.id}">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function openEditProduct(productId) {
      const product = products.find(item => Number(item.id) === Number(productId));
      if (!product) return;

      productIdInput.value = product.id;
      productNameInput.value = product.name;
      productPriceInput.value = product.price;
      productStockInput.value = product.stock;
      productEmojiInput.value = product.emoji || '';
      document.getElementById('saveProductBtn').textContent = 'تحديث المنتج';
      productNameInput.focus();
    }

    productForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const id = productIdInput.value ? Number(productIdInput.value) : Date.now();
      const name = productNameInput.value.trim();
      const price = Number(productPriceInput.value);
      const stock = Number(productStockInput.value);
      const emoji = productEmojiInput.value.trim() || '🛒';

      if (!name) {
        alert('يرجى إدخال اسم المنتج');
        return;
      }

      const existingIndex = products.findIndex(item => Number(item.id) === Number(id));

      if (existingIndex >= 0) {
        products[existingIndex] = { ...products[existingIndex], name, price, stock, emoji };
      } else {
        products.push({ id, name, price, stock, emoji });
      }

      saveProducts();
      renderAdminProducts();
      resetForm();
    });

    cancelEditBtn.addEventListener('click', resetForm);

    document.addEventListener('click', (event) => {
      const editButton = event.target.closest('[data-edit-id]');
      if (editButton) {
        openEditProduct(editButton.dataset.editId);
        return;
      }

      const deleteButton = event.target.closest('[data-delete-id]');
      if (deleteButton) {
        const productId = Number(deleteButton.dataset.deleteId);
        const product = products.find(item => Number(item.id) === productId);

        if (!product) return;

        const confirmed = window.confirm(`هل تريد حذف المنتج: ${product.name}?`);
        if (!confirmed) return;

        products = products.filter(item => Number(item.id) !== productId);
        saveProducts();
        renderAdminProducts();
        resetForm();
      }
    });

    renderAdminProducts();
  </script>
</body>
</html>
