<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة المنتجات | سوبر ماركت المدينة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--green:#16803c;--dark:#0e5a2a;--bg:#f5f7f5;--border:#dfe7df;--muted:#587062;--red:#d93636}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b2a1f;font-family:Cairo,Tahoma,sans-serif}
    .wrap{width:min(1200px,calc(100% - 28px));margin:24px auto}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:18px}
    h1,h2{color:var(--dark);margin-top:0}.layout{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:18px}
    .form{display:grid;gap:11px}.form label{display:grid;gap:5px;color:var(--muted);font-weight:700}
    input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:#1b2a1f}
    .check{display:flex!important;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8faf8}.check input{width:auto}
    .actions,.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:16px}
    button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--green);color:white}.secondary{background:#edf9f0;color:var(--dark)}.danger{background:var(--red)}
    .product{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:#f8faf8;margin-bottom:9px}.meta{min-width:0}.meta strong{display:block;overflow-wrap:anywhere}.meta small{color:var(--muted)}
    .status{padding:9px 12px;border-radius:10px;background:#f0f3f0;color:#344;font-weight:700;margin-bottom:12px}.error{background:#fff0f0;color:#a21c1c}.hidden{display:none!important}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.wrap{margin:14px auto}.panel{padding:16px}.product{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><h1>إدارة المنتجات</h1><div>التعديلات تحفظ مباشرة في قاعدة بيانات Supabase.</div></div>
      <div class="actions"><a href="index.html"><button type="button" class="secondary">العودة للمتجر</button></a><button type="button" id="logout" class="secondary hidden">تسجيل الخروج</button></div>
    </div>
    <div id="status" class="status">جارٍ الاتصال...</div>
    <section id="loginPanel" class="panel hidden">
      <h2>دخول المدير</h2>
      <form id="loginForm" class="form">
        <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required dir="ltr"></label>
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required dir="ltr"></label>
        <button type="submit">دخول</button>
      </form>
    </section>
    <section id="manager" class="panel hidden">
      <div class="layout">
        <form id="productForm" class="form">
          <h2 id="formTitle">إضافة منتج</h2>
          <input id="productId" type="hidden">
          <label>اسم المنتج<input id="name" required maxlength="200"></label>
          <label>التصنيف<select id="category"></select></label>
          <label>الوحدة<select id="unit"><option value="قطعة">قطعة</option><option value="علبة">علبة</option><option value="كيس">كيس</option><option value="كرتونة">كرتونة</option><option value="حبة">حبة</option><option value="كيلو">كيلو</option><option value="جرام">جرام</option></select></label>
          <label>السعر / سعر الوحدة<input id="price" type="number" min="0" step="0.01" required></label>
          <label>السعر السابق (اختياري)<input id="oldPrice" type="number" min="0" step="0.01"></label>
          <label>المخزون<input id="stock" type="number" min="0" step="1" required></label>
          <label class="check"><input id="weighted" type="checkbox"> يُباع بالوزن (أدخل المخزون بالجرام)</label>
          <div id="weightFields" class="hidden">
            <label>سعر الكيلو<input id="pricePerKg" type="number" min="0" step="0.01"></label>
            <label>أقل وزن للطلب (جرام)<input id="minWeight" type="number" min="1" step="1" value="250"></label>
            <label>خطوة اختيار الوزن (جرام)<input id="weightStep" type="number" min="1" step="1" value="100"></label>
          </div>
          <label>رمز المنتج (إيموجي)<input id="emoji" maxlength="8" placeholder="📦"></label>
          <div class="actions"><button id="saveBtn" type="submit">حفظ المنتج</button><button id="cancelBtn" type="button" class="secondary">إلغاء</button></div>
        </form>
        <div>
          <h2>المنتجات</h2>
          <input id="search" type="search" placeholder="ابحث بالاسم..." aria-label="ابحث بالاسم">
          <div id="productsList" style="margin-top:12px"></div>
        </div>
      </div>
    </section>
  </main>
<script>
(() => {
  const statusEl = document.getElementById('status');
  const loginPanel = document.getElementById('loginPanel');
  const manager = document.getElementById('manager');
  const form = document.getElementById('productForm');
  const $ = id => document.getElementById(id);
  let client = null;
  let categories = [];
  let products = [];

  function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.className = 'status' + (isError ? ' error' : '');
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function clearForm() {
    form.reset();
    $('productId').value = '';
    $('minWeight').value = '250';
    $('weightStep').value = '100';
    $('formTitle').textContent = 'إضافة منتج';
    $('saveBtn').textContent = 'حفظ المنتج';
    $('weightFields').classList.toggle('hidden', !$('weighted').checked);
  }
  async function checkAdmin() {
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError) throw sessionError;
    if (!sessionData.session) return false;
    const { data, error } = await client.rpc('is_admin');
    if (error) throw error;
    if (data !== true) {
      await client.auth.signOut();
      throw new Error('هذا الحساب ليس مديراً. أضف المستخدم إلى جدول admins في Supabase.');
    }
    return true;
  }
  async function loadCategories() {
    const { data, error } = await client.from('categories').select('id,name_ar,active,sort').order('sort').order('id');
    if (error) throw error;
    categories = data || [];
    $('category').innerHTML = '<option value="">بدون تصنيف</option>' + categories.map(c => `<option value="${c.id}">${escapeHtml(c.name_ar)}${c.active ? '' : ' (مخفي)'}</option>`).join('');
  }
  async function loadProducts() {
    const { data, error } = await client.from('products').select('id,sku,name_ar,price,old_price,stock,unit,category_id,active,is_weighted,price_per_kg,min_weight_grams,weight_step_grams,image_url').order('id', {ascending:false}).limit(2000);
    if (error) throw error;
    products = data || [];
    renderProducts();
  }
  function renderProducts() {
    const q = $('search').value.trim().toLocaleLowerCase();
    const filtered = products.filter(p => !q || (p.name_ar || '').toLocaleLowerCase().includes(q));
    $('productsList').innerHTML = filtered.length ? filtered.map(p => {
      const cat = categories.find(c => Number(c.id) === Number(p.category_id));
      const details = [cat?.name_ar || 'بدون تصنيف', p.unit || 'قطعة', p.is_weighted ? `بالوزن · ${Number(p.price_per_kg ?? p.price).toFixed(2)} / كجم` : `السعر ${Number(p.price).toFixed(2)}`, `المخزون ${p.stock}${p.is_weighted ? ' جرام' : ''}`, p.active ? 'ظاهر' : 'مخفي'].join(' · ');
      return `<article class="product"><div class="meta"><strong>${escapeHtml(p.name_ar)}</strong><small>${escapeHtml(details)}</small></div><div class="actions"><button type="button" class="secondary" data-edit="${p.id}">تعديل</button><button type="button" class="danger" data-delete="${p.id}">حذف</button></div></article>`;
    }).join('') : '<p>لا توجد منتجات مطابقة.</p>';
  }
  function editProduct(id) {
    const p = products.find(item => Number(item.id) === Number(id));
    if (!p) return;
    $('productId').value = p.id;
    $('name').value = p.name_ar || '';
    $('category').value = p.category_id == null ? '' : String(p.category_id);
    $('unit').value = p.unit || 'قطعة';
    $('price').value = p.price ?? 0;
    $('oldPrice').value = p.old_price ?? '';
    $('stock').value = p.stock ?? 0;
    $('weighted').checked = !!p.is_weighted;
    $('pricePerKg').value = p.price_per_kg ?? p.price ?? 0;
    $('minWeight').value = p.min_weight_grams ?? 250;
    $('weightStep').value = p.weight_step_grams ?? 100;
    $('formTitle').textContent = 'تعديل المنتج';
    $('saveBtn').textContent = 'حفظ التعديلات';
    $('weightFields').classList.toggle('hidden', !p.is_weighted);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  async function saveProduct(event) {
    event.preventDefault();
    const name = $('name').value.trim();
    const price = Number($('price').value);
    const stock = Number($('stock').value);
    const weighted = $('weighted').checked;
    const pricePerKg = Number($('pricePerKg').value || price);
    const minWeight = Number($('minWeight').value || 250);
    const weightStep = Number($('weightStep').value || 100);
    if (!name || !Number.isFinite(price) || price < 0 || !Number.isInteger(stock) || stock < 0) {
      setStatus('تحقق من الاسم والسعر والمخزون.', true); return;
    }
    if (weighted && (!Number.isFinite(pricePerKg) || pricePerKg < 0 || minWeight < 1 || weightStep < 1)) {
      setStatus('تحقق من سعر الكيلو والحد الأدنى وخطوة الوزن.', true); return;
    }
    const row = {
      name_ar: name,
      category_id: $('category').value ? Number($('category').value) : null,
      unit: $('unit').value,
      price: weighted ? pricePerKg : price,
      old_price: $('oldPrice').value === '' ? null : Number($('oldPrice').value),
      stock,
      is_weighted: weighted,
      price_per_kg: weighted ? pricePerKg : null,
      min_weight_grams: weighted ? minWeight : 250,
      weight_step_grams: weighted ? weightStep : 100,
      active: true
    };
    const id = $('productId').value;
    setStatus('جارٍ حفظ المنتج...');
    const result = id
      ? await client.from('products').update(row).eq('id', Number(id)).select('id').single()
      : await client.from('products').insert(row).select('id').single();
    if (result.error) {
      setStatus('فشل حفظ المنتج: ' + result.error.message + ' — إذا أضفت أعمدة الوزن للتو، أعد تحميل مخطط قاعدة البيانات في Supabase.', true);
      return;
    }
    clearForm();
    await loadProducts();
    setStatus('تم حفظ المنتج في Supabase.');
  }
  async function deleteProduct(id) {
    const p = products.find(item => Number(item.id) === Number(id));
    if (!p || !confirm(`حذف «${p.name_ar}»؟`)) return;
    setStatus('جارٍ حذف المنتج...');
    const { error } = await client.from('products').delete().eq('id', Number(id));
    if (error) {
      // Products referenced by past orders cannot be physically removed; archive instead.
      const archive = await client.from('products').update({active:false}).eq('id', Number(id));
      if (archive.error) {
        setStatus('تعذر حذف أو إخفاء المنتج: ' + archive.error.message, true);
        return;
      }
      setStatus('المنتج مرتبط بطلبات سابقة، لذلك أُخفي بدلاً من حذفه.');
    } else {
      setStatus('تم حذف المنتج.');
    }
    await loadProducts();
  }
  async function initialize() {
    if (!window.MD?.SUPABASE_URL || !window.MD?.SUPABASE_ANON_KEY || !window.supabase) {
      setStatus('تعذر الاتصال: تحقق من config.js ومكتبة Supabase.', true);
      loginPanel.classList.remove('hidden');
      return;
    }
    client = window.supabase.createClient(window.MD.SUPABASE_URL, window.MD.SUPABASE_ANON_KEY);
    try {
      const isAdmin = await checkAdmin();
      if (!isAdmin) {
        loginPanel.classList.remove('hidden');
        setStatus('سجل الدخول بحساب مدير Supabase.');
        return;
      }
      await showManager();
    } catch (error) {
      loginPanel.classList.remove('hidden');
      setStatus(error.message || 'تعذر التحقق من صلاحية الإدارة.', true);
    }
  }
  async function showManager() {
    await loadCategories();
    await loadProducts();
    loginPanel.classList.add('hidden');
    manager.classList.remove('hidden');
    $('logout').classList.remove('hidden');
    setStatus(`متصل بـ Supabase · ${products.length} منتج`);
  }

  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    setStatus('جارٍ تسجيل الدخول...');
    const { error } = await client.auth.signInWithPassword({email:$('email').value.trim(), password:$('password').value});
    if (error) { setStatus('فشل تسجيل الدخول: ' + error.message, true); return; }
    try {
      if (!await checkAdmin()) { setStatus('هذا الحساب ليس مديراً.', true); return; }
      await showManager();
    } catch (error) { setStatus(error.message || 'تعذر فتح الإدارة.', true); }
  });
  $('logout').addEventListener('click', async () => {
    await client.auth.signOut();
    manager.classList.add('hidden');
    $('logout').classList.add('hidden');
    loginPanel.classList.remove('hidden');
    setStatus('تم تسجيل الخروج.');
  });
  $('weighted').addEventListener('change', () => $('weightFields').classList.toggle('hidden', !$('weighted').checked));
  $('search').addEventListener('input', renderProducts);
  $('cancelBtn').addEventListener('click', () => { clearForm(); setStatus(`متصل بـ Supabase · ${products.length} منتج`); });
  form.addEventListener('submit', saveProduct);
  $('productsList').addEventListener('click', event => {
    const edit = event.target.closest('[data-edit]');
    const del = event.target.closest('[data-delete]');
    if (edit) editProduct(edit.dataset.edit);
    if (del) deleteProduct(del.dataset.delete).catch(error => setStatus(error.message, true));
  });
  initialize();
})();
</script>
</body>
</html>
