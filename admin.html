<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوبر ماركت المدينة</title>
  <style>
    :root {
      --green: #16803c;
      --green-dark: #0e5a2a;
      --green-soft: #edf9f0;
      --orange: #ffb347;
      --text: #1b2a1f;
      --muted: #587062;
      --bg: #f5f7f5;
      --card: #ffffff;
      --border: #dfe7df;
      --shadow: 0 12px 32px rgba(18, 58, 32, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", "Tahoma", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--green-dark);
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 700;
    }

    .nav a:hover { color: var(--green-dark); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      min-width: 240px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      color: var(--text);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      background: var(--green);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button.secondary {
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid rgba(22, 128, 60, 0.15);
    }

    .button.danger {
      background: #e14b4b;
      color: white;
      border: 1px solid rgba(225, 75, 75, 0.2);
    }

    .section {
      padding: 26px 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.2rem);
      color: var(--green-dark);
    }

    .admin-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }

    .product-form {
      background: #f8faf8;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .product-form label {
      display: grid;
      gap: 8px;
      font-weight: 700;
      color: var(--muted);
    }

    .product-form input,
    .product-form select {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      color: var(--text);
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .admin-products-list {
      display: grid;
      gap: 10px;
    }

    .admin-product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #f8faf8;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .admin-product-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .admin-product-emoji {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: #edf9f0;
    }

    .admin-product-meta {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .admin-product-meta strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .admin-product-meta span {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .admin-product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .footer {
      background: #0f2018;
      color: rgba(255,255,255,0.8);
      padding: 26px 0;
      margin-top: 40px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 840px) {
      .topbar-inner { flex-direction: column; align-items: stretch; }
      .nav { justify-content: center; }
      .header-actions { justify-content: center; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-product-row { flex-direction: column; align-items: stretch; }
      .admin-product-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        المدينة
        <small>سوبر ماركت</small>
      </div>

      <nav class="nav">
        <a href="index.html">الرئيسية</a>
        <a href="admin.html">لوحة الإدارة</a>
      </nav>

      <div class="header-actions">
        <button class="button secondary" type="button" onclick="location.href='index.html'">العودة للمتجر</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container admin-panel">
        <div class="section-head">
          <h2>لوحة إدارة المنتجات</h2>
        </div>

        <div class="admin-layout">
          <form id="productForm" class="product-form">
            <input id="productId" type="hidden" />

            <label>
              اسم المنتج
              <input id="productName" type="text" placeholder="مثال: لبن طويل الأمد" required />
            </label>

            <label>
              السعر (ر.س)
              <input id="productPrice" type="number" min="0" step="0.01" placeholder="12.50" required />
            </label>

            <label>
              المخزون
              <input id="productStock" type="number" min="0" step="1" placeholder="20" required />
            </label>

            <label>
              التصنيف
              <select id="productCategory">
                <option value="مواد غذائية">مواد غذائية</option>
                <option value="مشروبات">مشروبات</option>
                <option value="ألبان">ألبان</option>
                <option value="منظفات">منظفات</option>
                <option value="عناية شخصية">عناية شخصية</option>
                <option value="مجمدات">مجمدات</option>
                <option value="معلبات">معلبات</option>
                <option value="مخبوزات">مخبوزات</option>
              </select>
            </label>

            <label>
              الوحدة
              <select id="productUnit">
                <option value="قطعة">قطعة</option>
                <option value="علبة">علبة</option>
                <option value="كيس">كيس</option>
                <option value="كيلو">كيلو</option>
                <option value="جرام">جرام</option>
              </select>
            </label>

            <label>
              سعر الكيلو (ر.س)
              <input id="productPricePerKg" type="number" min="0" step="0.01" placeholder="8.50" />
            </label>

            <label>
              الحد الأدنى للوزن (جرام)
              <input id="productMinWeight" type="number" min="50" step="50" value="250" />
            </label>

            <label>
              خطوة الزيادة (جرام)
              <input id="productWeightStep" type="number" min="50" step="50" value="100" />
            </label>

            <label>
              رمز المنتج
              <input id="productEmoji" type="text" maxlength="2" placeholder="🥤" />
            </label>

            <label class="checkbox-row">
              <input id="productIsWeighted" type="checkbox" />
              <span>يُباع بالوزن (كيلو / جرام)</span>
            </label>

            <div class="form-actions">
              <button id="saveProductBtn" class="button" type="submit">حفظ المنتج</button>
              <button id="cancelEditBtn" class="button secondary" type="button">إلغاء</button>
            </div>
          </form>

          <div>
            <div class="section-head" style="margin-bottom: 12px;">
              <h2 style="font-size: 1.4rem;">قائمة المنتجات</h2>
            </div>
            <div id="adminProductsList" class="admin-products-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <strong>السوق المدينة</strong><br />
        متجر يومي يوفر كل احتياجات العائلة.
      </div>
      <div>واتساب: 966500000000+</div>
      <div>العنوان: المدينة المنورة</div>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'md_products';

    function normalizeProduct(product) {
      if (!product || typeof product !== 'object') return null;

      const safeId = Number(product.id ?? Date.now() + Math.random());
      const safeName = product.name || product.name_ar || 'منتج جديد';
      const safeCategory = product.category || product.cat || 'منتجات أخرى';
      const safeUnit = product.unit || 'قطعة';
      const safePrice = Number(product.price ?? product.base_price ?? 0);
      const safeOld = Number(product.old ?? product.old_price ?? 0);
      const safeStock = Number(product.stock ?? 0);
      const safeEmoji = product.emoji || product.ic || '🛒';
      const safeIsWeighted = !!(product.isWeighted || product.weighted || product.is_weighted || ['كيلو', 'جرام'].includes((safeUnit || '').trim()));
      const safePricePerKg = Number(product.pricePerKg ?? product.price_per_kg ?? safePrice);
      const safeMinWeight = Number(product.minWeight ?? product.min_weight ?? 250);
      const safeWeightStep = Number(product.weightStep ?? product.weight_step ?? 100);

      return {
        id: safeId,
        name: safeName,
        category: safeCategory,
        cat: safeCategory,
        price: safePrice,
        old: safeOld,
        old_price: safeOld,
        stock: safeStock,
        emoji: safeEmoji,
        ic: safeEmoji,
        unit: safeUnit,
        isWeighted: safeIsWeighted,
        weightStep: safeWeightStep,
        minWeight: safeMinWeight,
        pricePerKg: safePricePerKg,
        isNew: !!product.isNew,
        hidden: !!product.hidden,
        min: Number(product.min ?? product.min_stock ?? 5)
      };
    }

    const defaultProducts = [
      { id: 1, name: 'كوكاكولا 1.25 لتر', category: 'مشروبات', price: 8.5, stock: 40, emoji: '🥤', unit: 'علبة', isWeighted: false },
      { id: 2, name: 'مياه معدنية 1.5 لتر', category: 'مشروبات', price: 1.5, stock: 200, emoji: '💧', unit: 'علبة', isWeighted: false },
      { id: 3, name: 'عصير برتقال 1 لتر', category: 'مشروبات', price: 6, stock: 3, emoji: '🧃', unit: 'علبة', isWeighted: false },
      { id: 4, name: 'أرز بسمتي 5 كيلو', category: 'مواد غذائية', price: 32, stock: 25, emoji: '🍚', unit: 'كيس', isWeighted: false },
      { id: 5, name: 'مكرونة سباغيتي 500 جرام', category: 'مواد غذائية', price: 2.5, stock: 120, emoji: '🍝', unit: 'علبة', isWeighted: false },
      { id: 6, name: 'سكر أبيض 1 كيلو', category: 'مواد غذائية', price: 3.5, stock: 80, emoji: '🍬', unit: 'كيلو', isWeighted: true, pricePerKg: 3.5, minWeight: 250, weightStep: 100 },
      { id: 7, name: 'زيت دوار الشمس 1.8 لتر', category: 'مواد غذائية', price: 18, stock: 0, emoji: '🫒', unit: 'علبة', isWeighted: false }
    ];

    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultProducts;
    products = (Array.isArray(products) ? products : []).map(normalizeProduct).filter(Boolean);

    const productForm = document.getElementById('productForm');
    const productIdInput = document.getElementById('productId');
    const productNameInput = document.getElementById('productName');
    const productPriceInput = document.getElementById('productPrice');
    const productStockInput = document.getElementById('productStock');
    const productEmojiInput = document.getElementById('productEmoji');
    const productCategoryInput = document.getElementById('productCategory');
    const productUnitInput = document.getElementById('productUnit');
    const productPricePerKgInput = document.getElementById('productPricePerKg');
    const productMinWeightInput = document.getElementById('productMinWeight');
    const productWeightStepInput = document.getElementById('productWeightStep');
    const productIsWeightedInput = document.getElementById('productIsWeighted');
    const adminProductsList = document.getElementById('adminProductsList');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products.map(normalizeProduct).filter(Boolean)));
    }

    function resetForm() {
      productForm.reset();
      productIdInput.value = '';
      productCategoryInput.value = 'مواد غذائية';
      productUnitInput.value = 'قطعة';
      productPricePerKgInput.value = '';
      productMinWeightInput.value = '250';
      productWeightStepInput.value = '100';
      productIsWeightedInput.checked = false;
      document.getElementById('saveProductBtn').textContent = 'حفظ المنتج';
    }

    function renderAdminProducts() {
      if (!adminProductsList) return;

      if (!products.length) {
        adminProductsList.innerHTML = '<div class="empty-state" style="padding:20px; color:#587062; background:#f8faf8; border:1px solid var(--border); border-radius:14px;">لا توجد منتجات.</div>';
        return;
      }

      adminProductsList.innerHTML = products.map(product => {
        const item = normalizeProduct(product);
        const category = item.category || 'منتجات أخرى';
        const unit = item.unit || 'قطعة';
        const typeText = item.isWeighted ? 'يُباع بالوزن' : 'قطعة / علبة';

        return `
          <div class="admin-product-row">
            <div class="admin-product-info">
              <div class="admin-product-emoji">${item.emoji || '🛒'}</div>
              <div class="admin-product-meta">
                <strong>${item.name}</strong>
                <span>${Number(item.price).toFixed(2)} ر.س • ${category} • ${unit} • ${typeText}</span>
              </div>
            </div>
            <div class="admin-product-actions">
              <button class="button secondary" type="button" data-edit-id="${item.id}">تعديل</button>
              <button class="button danger" type="button" data-delete-id="${item.id}">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openEditProduct(productId) {
      const product = products.find(item => Number(item.id) === Number(productId));
      if (!product) return;

      const item = normalizeProduct(product);
      productIdInput.value = item.id;
      productNameInput.value = item.name;
      productPriceInput.value = item.price;
      productStockInput.value = item.stock;
      productEmojiInput.value = item.emoji || '';
      productCategoryInput.value = item.category || 'مواد غذائية';
      productUnitInput.value = item.unit || 'قطعة';
      productIsWeightedInput.checked = !!item.isWeighted;
      productPricePerKgInput.value = item.pricePerKg || item.price;
      productMinWeightInput.value = item.minWeight || 250;
      productWeightStepInput.value = item.weightStep || 100;
      document.getElementById('saveProductBtn').textContent = 'تحديث المنتج';
      productNameInput.focus();
    }

    productForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const id = productIdInput.value ? Number(productIdInput.value) : Date.now();
      const name = productNameInput.value.trim();
      const price = Number(productPriceInput.value);
      const stock = Number(productStockInput.value);
      const emoji = productEmojiInput.value.trim() || '🛒';
      const category = productCategoryInput.value || 'منتجات أخرى';
      const unit = productUnitInput.value || 'قطعة';
      const isWeighted = productIsWeightedInput.checked;
      const pricePerKg = Number(productPricePerKgInput.value || price || 0);
      const minWeight = Number(productMinWeightInput.value || 250);
      const weightStep = Number(productWeightStepInput.value || 100);

      if (!name) {
        alert('يرجى إدخال اسم المنتج');
        return;
      }

      const existingIndex = products.findIndex(item => Number(item.id) === Number(id));
      const productData = {
        id,
        name,
        category,
        cat: category,
        price,
        old: 0,
        old_price: 0,
        stock,
        emoji,
        ic: emoji,
        unit,
        isWeighted,
        pricePerKg,
        minWeight,
        weightStep,
        isNew: false,
        hidden: false,
        min: 5
      };

      if (existingIndex >= 0) {
        products[existingIndex] = normalizeProduct(productData);
      } else {
        products.push(normalizeProduct(productData));
      }

      saveProducts();
      renderAdminProducts();
      resetForm();
    });

    cancelEditBtn.addEventListener('click', resetForm);

    document.addEventListener('click', (event) => {
      const editButton = event.target.closest('[data-edit-id]');
      if (editButton) {
        openEditProduct(editButton.dataset.editId);
        return;
      }

      const deleteButton = event.target.closest('[data-delete-id]');
      if (deleteButton) {
        const productId = Number(deleteButton.dataset.deleteId);
        const product = products.find(item => Number(item.id) === productId);

        if (!product) return;

        const confirmed = window.confirm(`هل تريد حذف المنتج: ${product.name}?`);
        if (!confirmed) return;

        products = products.filter(item => Number(item.id) !== productId);
        saveProducts();
        renderAdminProducts();
        resetForm();
      }
    });

    resetForm();
    renderAdminProducts();
  </script>
</body>
</html>
