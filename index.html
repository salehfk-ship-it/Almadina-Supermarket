x}.hero b{font-size:26px;display:block}.hero span{background:var(--r);padding:2px 10px;border-radius:8px;font-weight:700}.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.cat{flex:none;border:1.5px solid var(--b);background:var(--c);border-radius:14px;padding:10px 14px;font-weight:600;min-height:48px}.cat.on{background:var(--g);color:#fff;border-color:var(--g)}h2{margin:14px 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}.ph{font-size:56px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}.nm{font-weight:700;min-height:2.6em;line-height:1.3}.pr{color:var(--g);font-weight:800;font-size:20px}.old{color:var(--m);text-decoration:line-through;font-size:14px;margin-inline-start:6px}.dc{position:absolute;top:8px;right:8px;background:var(--r);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:700}.st{font-size:14px;font-weight:600}.ok{color:var(--g)}.lo{color:#b86e00}.no{color:var(--r)}.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--b);border-radius:10px}.qty button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:800}.add{background:var(--r);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800}.add:disabled{background:var(--b);color:var(--m)}nav{position:fixed;bottom:0;inset-inline:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px;font-weight:600}nav button b{display:block;font-size:20px}#ov{position:fixed;inset:0;background:#0008;display:none;z-index:9}#ov.on{display:flex;align-items:flex-end;justify-content:center}#sh{background:var(--c);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.f input,.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:10px;background:var(--bg);margin:4px 0 10px}.tot{font-weight:800;font-size:19px}.big{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:18px;margin-top:8px}.err{background:#e3272622;color:var(--r);border-radius:10px;padding:10px;margin:8px 0;font-weight:600}footer{text-align:center;color:var(--m);padding:20px;font-size:14px}#adm{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px}.at{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tb{border-collapse:collapse;width:100%}.tb th,.tb td{border-bottom:1px solid var(--b);padding:7px 8px;text-align:right;vertical-align:middle}.tb input[type="checkbox"]{transform:scale(1.2)}.np{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.muted{color:var(--m);font-size:13px}</style></head><body><header><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4RbURXhpZgAASUkqAAgAAAAEABIBAwABAAAAAQAAADEBAgAHAAAAPgAAABICAwACAAAAAgACAGmHBAABAAAARgAAANQAAABQaWNhc2EAAAYAAJAHAAQAAAAwMjIwAaA[... ]" alt="logo"><input id="q" placeholder="بحث المنتجات..."><button class="cartb" onclick="openCart()">🛒<i id="cn">0</i></button><button class="cartb" onclick="openAdm();return false" style="padding-inline:12px">⚙️</button></header><main><div id="hb"></div><div class="hero"><b>سوبر ماركت المدينة</b>خياراتك الأفضل — اطلب الآن واستلم في بيتك <span>توصيل سريع</span></div><div class="cats" id="cats"></div><div id="list"></div></main><footer><div id="ft"></div><a href="#" onclick="openAdm();return false" style="color:var(--g);font-weight:700">دخول الإدارة</a><br>سوبر ماركت المدينة · ALMADINA SUPERMARKET</footer><nav><button onclick="go('')"><b>🏠</b>الرئيسية</button><button onclick="go('')"><b>▦</b>الأقسام</button><button onclick="go('offers')"><b>%</b>العروض</button><button onclick="openCart()"><b>🛒</b>السلة</button></nav><div id="adm"></div><div id="ov" onclick="if(event.target==this)closeS()"><div id="sh"></div></div><script>
const sb=(window.MD&&MD.SUPABASE_URL&&window.supabase)?supabase.createClient(MD.SUPABASE_URL,MD.SUPABASE_ANON_KEY):null;
const CONFIG={WHATSAPP_NUMBER:"",currency:"د.ل",deliveryOn:true,pickupOn:true,minOrder:20,freeAbove:150,zones:[{n:"وسط المدينة",f:5},{n:"المنطقة 2",f:8},{n:"المنطقة 3",f:12}]};
const CATS=["الكل","العروض","مواد غذائية","مشروبات","ألبان","منظفات","عناية شخصية","مجمدات","معلبات","مخبوزات","خضار وفواكه","لحوم ودواجن","حلويات وسناكس","مستلزمات الأطفال","بهارات وتوابل"];
let P=[
[1,"كوكاكولا 1.25 لتر","مشروبات",8.5,10,40,"🥤","عبوة",0],[2,"مياه معدنية 1.5 لتر","مشروبات",1.5,0,200,"💧","عبوة",0],[3,"عصير برتقال 1 لتر","مشروبات",6,7.5,3,"🧃","عبوة",0],[4,"أرز بسمتي 5 كيلو","مواد غذائية",32,38,25,"🍚","كيس",0],[5,"مكرونة سباغيتي 500 جرام","مواد غذائية",2.5,0,120,"🍝","عبوة",1],[6,"سكر أبيض 1 كيلو","مواد غذائية",3.5,0,80,"🍬","كيلو",0],[7,"زيت دوار الشمس 1.8 لتر","مواد غذائية",18,21,0,"🛢️","عبوة",0],[8,"حليب طازج 1 لتر","ألبان",4.5,0,60,"🥛","عبوة",1],[9,"جبنة شرائح 200 جرام","ألبان",7,8,4,"🧀","عبوة",0],[10,"زبادي طبيعي","ألبان",1.2,0,100,"🍶","عبوة",0],[11,"سائل غسيل أطباق","منظفات",6.5,8,30,"🧴","عبوة",0],[12,"مسحوق غسيل 3 كيلو","منظفات",22,26,18,"🧺","كرتونة",0],[13,"شامبو 400 مل","عناية شخصية",14,17,22,"🧼","عبوة",0],[14,"معجون أسنان","عناية شخصية",5,0,50,"🪥","قطعة",1],[15,"بطاطس مجمدة 1 كيلو","مجمدات",9,11,15,"🍟","كيس",0],[16,"دجاج مجمد 1 كيلو","مجمدات",16,0,12,"🍗","كيلو",0],[17,"تونة معلبة","معلبات",4.5,5.5,70,"🐟","علبة",0],[18,"طماطم معجون 800 جرام","معلبات",5,0,45,"🥫","علبة",0],[19,"خبز تنور","مخبوزات",1,0,90,"🥖","حبة",1],[20,"كرواسون","مخبوزات",1.5,2,2,"🥐","حبة",1]
].map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],old:a[4],stock:a[5],ic:a[6],unit:a[7],isNew:a[8],min:5}));
let lim=40,LD=!!sb,cat="الكل",term="",cart={},sel={},selectedProducts=new Set();
try{const sp=JSON.parse(localStorage.getItem("md_products")||"null");if(sp)P=sp;const sc=JSON.parse(localStorage.getItem("md_config")||"null");if(sc)Object.assign(CONFIG,sc)}catch(e){}
try{cart=JSON.parse(localStorage.getItem("md_cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id),fm=n=>(Math.round(n*100)/100)+" "+CONFIG.currency;
const save=()=>{try{localStorage.setItem("md_cart",JSON.stringify(cart))}catch(e){}},sP=()=>{try{localStorage.setItem("md_products",JSON.stringify(P))}catch(e){}render()},sC=()=>{try{localStorage.setItem("md_config",JSON.stringify(CONFIG))}catch(e){}},gO=()=>{try{return JSON.parse(localStorage.getItem("md_orders")||"[]")}catch(e){return[]}},sO=o=>{try{localStorage.setItem("md_orders",JSON.stringify(o))}catch(e){}},byId=id=>P.find(p=>p.id==id),stat=p=>p.stock<=0?["نفذت الكمية","no"]:p.stock<=p.min?["كمية محدودة ("+p.stock+")","lo"]:["متوفر","ok"];
function closeS(){$("ov").classList.remove("on")}function sheet(h){$("sh").innerHTML=h;$("ov").classList.add("on")}
function go(c){cat=c==="offers"?"العروض":"الكل";term="";$("q").value="";render();scrollTo(0,0)}
function match(p){if(p.hidden)return 0;if(cat==="العروض"&&!p.old)return 0;if(cat!=="الكل"&&cat!=="العروض"&&p.cat!==cat)return 0;const t=term.trim();return !t||(p.name+p.cat+"MD"+p.id+(p.bc||"")).includes(t)}
function card(p){const [s,c]=stat(p),d=p.old?Math.round((1-p.price/p.old)*100):0,q=sel[p.id]||1;return `<div class="card">${d?`<span class="dc">خصم ${d}%</span>`:""}<div class="ph" onclick="det(${p.id})" style="cursor:pointer">${p.img?`<img src="${p.img}" alt="" loading="lazy" style="width:100%;height:120px;object-fit:cover;border-radius:10px">`:p.ic}</div><div><div class="nm" onclick="det(${p.id})" style="cursor:pointer">${p.name}</div></div><div><span class="pr">${fm(p.price)}</span>${p.old?`<span class="old">${fm(p.old)}</span>`:""}</div><div class="st ${c}">${s} · ${p.unit}</div><div class="qty"><button onclick="sq(${p.id},1)" aria-label="زيادة">+</button><b>${q}</b><button onclick="sq(${p.id},-1)" aria-label="نقصان">−</button></div><button class="add" ${p.stock<=0?"disabled":""} onclick="addC(${p.id})">${p.stock<=0?"غير متوفر حالياً":"إضافة للسلة"}</button></div>`}
function sq(id,d){sel[id]=Math.max(1,(sel[id]||1)+d);render()}function addC(id){const p=byId(id),n=(cart[id]||0)+(sel[id]||1);if(n>p.stock){alert("الكمية المطلوبة غير متوفرة حالياً. الكمية المتوفرة: "+p.stock);return}cart[id]=n;sel[id]=1;save();render()}
function render(){if(LD){$("list").innerHTML=`<div class="grid">${'<div class="card" style="height:230px;opacity:.5"></div>'.repeat(8)}</div>`;return}$("cats").innerHTML=CATS.map(c=>`<button class="cat ${c===cat?"on":""}" onclick="cat='${c}';term='';$('q').value='';render()">${c}</button>`).join("");const L=P.filter(match);let h="";if(cat=="الكل"&&!term){const o=P.filter(p=>p.old&&!p.hidden).slice(0,5),n=P.filter(p=>p.isNew&&!p.hidden);h+=`<h2>عروض اليوم</h2><div class="grid">${o.map(card).join("")}</div><h2>المنتجات الجديدة</h2><div class="grid">${n.map(card).join("")}</div><h2>جميع المنتجات</h2>`}h+=L.length?`<div class="grid">${L.slice(0,lim).map(card).join("")}</div>${L.length>lim?`<button class="big" onclick="lim+=40;render()">عرض المزيد</button>":""}`:`<p class="err">لم يتم العثور على منتج يطابق البحث</p>`;$("list").innerHTML=h;ftr();$("cn").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
$("q").oninput=e=>{term=e.target.value;cat="الكل";render()};
const sub=()=>Object.entries(cart).reduce((a,[i,q])=>a+byId(i).price*q,0);
function openCart(){const ids=Object.keys(cart);if(!ids.length){sheet(`<h2>السلة</h2><p>السلة فارغة</p><button class="big" onclick="closeS()">متابعة التسوق</button>`);return}sheet(`<h2>السلة</h2>${ids.map(i=>{const p=byId(i);return `<div class="row"><div>${p.ic} ${p.name}<br><small>${fm(p.price)} × ${cart[i]}</small></div><div><b>${fm(p.price*cart[i])}</b><br><button class="cat" onclick="cc(${i},1)">+</button> <button class="cat" onclick="cc(${i},-1)">−</button></div></div>`}).join("")}<div class="row tot"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div><button class="big" onclick="checkout()">إتمام الطلب</button><button class="cat" style="width:100%;margin-top:8px" onclick="if(confirm('تفريغ السلة؟')){cart={};save();render();closeS()}">تفريغ السلة</button>`)}
function cc(i,d){const p=byId(i),n=(cart[i]||0)+d;if(n>p.stock){alert("الكمية المتوفرة: "+p.stock);return}if(n<=0)delete cart[i];else cart[i]=n;save();render();openCart()}
function fee(){const m=$("dm")?$("dm").value:"delivery";if(m!=="delivery"||sub()>=CONFIG.freeAbove)return 0;return CONFIG.zones[+($("zn")?$("zn").value:0)].f}
function upd(){const dl=$("dm").value==="delivery";$("dz").style.display=dl?"block":"none";$("tt").textContent=fm(sub()+fee());$("fe").textContent=fm(fee())}
function checkout(){sheet(`<h2>إتمام الطلب</h2><div class="f"><label>الاسم الكامل</label><input id="nm"><label>رقم الهاتف</label><input id="ph" type="tel" inputmode="numeric"><label>العنوان</label><textarea id="ad" rows="2"></textarea><label>طريقة الاستلام</label><select id="dm" onchange="upd()">${CONFIG.deliveryOn?'<option value="delivery">توصيل للمنزل</option>':""}${CONFIG.pickupOn?'<option value="pickup">استلام من المتجر</option>':""}</select><div id="dz"><label>المنطقة</label><select id="zn" onchange="upd()">${CONFIG.zones.map((z,i)=>`<option value="${i}">${z.n} — ${z.f} ${CONFIG.currency}</option>`).join("")}</select></div><label>ملاحظات الطلب</label><textarea id="nt" rows="2"></textarea></div><div id="er"></div><div class="row"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div><div class="row"><span>التوصيل</span><span id="fe"></span></div><div class="row tot"><span>الإجمالي</span><span id="tt"></span></div><button class="big" onclick="send()">إرسال الطلب عبر واتساب</button>`);upd();pre()}
function det(id){const p=byId(id),[s,c]=stat(p),q=sel[id]||1;sheet(`<div class="ph" style="font-size:90px">${p.img?`<img src="${p.img}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:18px">`:p.ic}</div><h2>${p.name}</h2><div class="row"><span>القسم</span><span>${p.cat}</span></div><div class="row"><span>السعر</span><span>${fm(p.price)}</span></div><div class="row"><span>المخزون</span><span class="${c}">${s}</span></div><div class="row"><span>الوحدة</span><span>${p.unit}</span></div><div class="qty" style="margin:10px 0"><button onclick="sq(${p.id},1)">+</button><b>${q}</b><button onclick="sq(${p.id},-1)">−</button></div><button class="add" ${p.stock<=0?"disabled":""} onclick="addC(${p.id});closeS()">${p.stock<=0?"غير متوفر":"إضافة للسلة"}</button>`)}
function pre(){try{const m=JSON.parse(localStorage.getItem("md_me")||"null");if(m){$("nm").value=m.nm;$("ph").value=m.ph;$("ad").value=m.ad||""}}catch(e){}}
function acct(){let m={},o=[];try{m=JSON.parse(localStorage.getItem("md_me")||"{}");o=JSON.parse(localStorage.getItem("md_my")||"[]")}catch(e){}sheet(`<h2>حسابي</h2><p>${m.nm?m.nm+" · "+m.ph+"<br>العنوان المحفوظ: "+(m.ad||"-"):"بياناتك تُحفظ على هذا الجهاز بعد أول طلب، ولا تحتاج لإنشاء حساب منفصل."}</p><button class="big" onclick="closeS()">موافق</button>`)}
