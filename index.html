<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - المنتجات</title>
  <style>
    :root {
      --green: #16803c;
      --green-dark: #0e5a2a;
      --red: #e32726;
      --red-dark: #b91c1c;
      --bg: #f5f7f5;
      --card: #ffffff;
      --border: #dfe7df;
      --text: #1d2b22;
      --muted: #6b7d72;
      --shadow: 0 10px 30px rgba(12, 45, 25, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cairo", "Tahoma", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .admin-shell {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.2rem);
      color: var(--green-dark);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8faf8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      min-width: min(100%, 320px);
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(22, 128, 60, 0.12);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      font-family: inherit;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary-btn {
      background: var(--green);
      color: #fff;
    }

    .danger-btn {
      background: var(--red);
      color: #fff;
    }

    .ghost-btn {
      background: #eef5ef;
      color: var(--green-dark);
      border: 1px solid var(--border);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 18px;
    }

    .delete-btn {
      background: rgba(227, 39, 38, 0.1);
      color: var(--red-dark);
      border: 1px solid rgba(227, 39, 38, 0.15);
    }

    .edit-btn {
      background: rgba(22, 128, 60, 0.1);
      color: var(--green-dark);
      border: 1px solid rgba(22, 128, 60, 0.15);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #f4faf5;
      color: var(--green-dark);
      font-size: 14px;
    }

    tbody tr:hover {
      background: #fafdfb;
    }

    .name-cell {
      text-align: right;
    }

    .product-name {
      width: 100%;
      max-width: 360px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
      color: var(--text);
    }

    .price-input {
      width: 110px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 15px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 28px;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .admin-shell { padding: 16px; }
      .admin-header { align-items: flex-start; }
      .toolbar { align-items: stretch; }
      .toolbar-left, .toolbar-right { width: 100%; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-header">
      <h1>لوحة التحكم - المنتجات</h1>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input id="productSearch" class="search-box" type="search" placeholder="ابحث عن المنتج..." />
      </div>

      <div class="toolbar-right">
        <label style="display:flex;align-items:center;gap:8px;font-weight:600;">
          <input id="selectAll" class="checkbox" type="checkbox" />
          تحديد الكل
        </label>
        <button id="bulkDelete" class="danger-btn">حذف المحدد</button>
        <button id="addProduct" class="primary-btn">إضافة منتج</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:48px;"><input id="headerSelectAll" class="checkbox" type="checkbox" /></th>
            <th class="name-cell">اسم المنتج</th>
            <th>السعر</th>
            <th>المخزون</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'md_products';

    const defaultProducts = [
      { id: 1, name: 'كوكاكولا 1.25 لتر', price: 8.5, stock: 40 },
      { id: 2, name: 'مياه معدنية 1.5 لتر', price: 1.5, stock: 200 },
      { id: 3, name: 'عصير برتقال 1 لتر', price: 6, stock: 3 },
      { id: 4, name: 'أرز بسمتي 5 كيلو', price: 32, stock: 25 },
      { id: 5, name: 'مكرونة سباغيتي 500 جرام', price: 2.5, stock: 120 },
      { id: 6, name: 'سكر أبيض 1 كيلو', price: 3.5, stock: 80 },
      { id: 7, name: 'زيت دوار الشمس 1.8 لتر', price: 18, stock: 0 }
    ];

    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultProducts;
    const selected = new Set();

    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function renderProducts() {
      const search = document.getElementById('productSearch').value.trim().toLowerCase();
      const filtered = products.filter(p => !search || p.name.toLowerCase().includes(search));

      const tbody = document.getElementById('productTable');
      tbody.innerHTML = filtered.length ? filtered.map(product => `
        <tr data-id="${product.id}">
          <td><input class="checkbox product-checkbox" type="checkbox" data-id="${product.id}" ${selected.has(product.id) ? 'checked' : ''} /></td>
          <td class="name-cell">
            <input class="product-name" type="text" value="${product.name.replace(/"/g, '&quot;')}" data-id="${product.id}" aria-label="اسم المنتج" />
          </td>
          <td>
            <input class="price-input product-price" type="number" min="0" step="0.1" value="${product.price}" data-id="${product.id}" aria-label="السعر" />
          </td>
          <td>
            <input class="price-input product-stock" type="number" min="0" step="1" value="${product.stock}" data-id="${product.id}" aria-label="المخزون" />
          </td>
          <td>
            <button class="icon-btn edit-btn" title="تحديث المنتج" data-id="${product.id}">✎</button>
            <button class="icon-btn delete-btn" title="حذف المنتج" data-id="${product.id}">🗑</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty-state">لا توجد منتجات مطابقة للبحث</td></tr>';

      const allChecked = filtered.length > 0 && filtered.every(product => selected.has(product.id));
      const headerCheckbox = document.getElementById('headerSelectAll');
      const selectAllCheckbox = document.getElementById('selectAll');
      if (headerCheckbox) headerCheckbox.checked = allChecked;
      if (selectAllCheckbox) selectAllCheckbox.checked = allChecked;
    }

    function saveSingleProduct(id, field, value) {
      const product = products.find(item => item.id === id);
      if (!product) return;

      if (field === 'name') {
        product.name = String(value || '').trim() || product.name;
      }
      if (field === 'price') {
        product.price = Number(value) || 0;
      }
      if (field === 'stock') {
        product.stock = Number(value) || 0;
      }

      saveProducts();
      renderProducts();
    }

    function toggleSelection(id, checked) {
      if (checked) selected.add(id); else selected.delete(id);
      renderProducts();
    }

    function bulkDeleteSelected() {
      if (selected.size === 0) {
        alert('اختر منتجاً واحداً على الأقل للحذف');
        return;
      }

      const confirmed = confirm(`هل تريد حذف ${selected.size} منتج(ـات) المحدد(ة)؟`);
      if (!confirmed) return;

      products = products.filter(product => !selected.has(product.id));
      selected.clear();
      saveProducts();
      renderProducts();
    }

    function addProduct() {
      const name = prompt('أدخل اسم المنتج الجديد');
      if (!name || !name.trim()) return;

      const nextId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
      products.unshift({
        id: nextId,
        name: name.trim(),
        price: 0,
        stock: 0
      });

      saveProducts();
      renderProducts();
    }

    document.getElementById('productSearch').addEventListener('input', renderProducts);

    document.getElementById('selectAll').addEventListener('change', (event) => {
      const checked = event.target.checked;
      const visible = products.filter(product => product.name.toLowerCase().includes(document.getElementById('productSearch').value.trim().toLowerCase()));
      visible.forEach(product => toggleSelection(product.id, checked));
    });

    document.getElementById('headerSelectAll').addEventListener('change', (event) => {
      const checked = event.target.checked;
      const visible = products.filter(product => product.name.toLowerCase().includes(document.getElementById('productSearch').value.trim().toLowerCase()));
      visible.forEach(product => toggleSelection(product.id, checked));
    });

    document.getElementById('bulkDelete').addEventListener('click', bulkDeleteSelected);
    document.getElementById('addProduct').addEventListener('click', addProduct);

    document.addEventListener('change', (event) => {
      const target = event.target;

      if (target.matches('.product-checkbox')) {
        toggleSelection(Number(target.dataset.id), target.checked);
        return;
      }

      if (target.matches('.product-name')) {
        saveSingleProduct(Number(target.dataset.id), 'name', target.value);
        return;
      }

      if (target.matches('.product-price')) {
        saveSingleProduct(Number(target.dataset.id), 'price', target.value);
        return;
      }

      if (target.matches('.product-stock')) {
        saveSingleProduct(Number(target.dataset.id), 'stock', target.value);
      }
    });

    document.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target) return;

      const id = Number(target.dataset.id);
      if (target.classList.contains('delete-btn')) {
        const confirmed = confirm('هل تريد حذف هذا المنتج؟');
        if (!confirmed) return;
        products = products.filter(product => product.id !== id);
        selected.delete(id);
        saveProducts();
        renderProducts();
      }

      if (target.classList.contains('edit-btn')) {
        const product = products.find(item => item.id === id);
        if (!product) return;
        alert(`تم تحديث المنتج: ${product.name}`);
      }
    });

    renderProducts();
  </script>
</body>
</html>
