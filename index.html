<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>سوبر ماركت المدينة | ALMADINA SUPERMARKET</title><meta name="description" content="تسوق من سوبر ماركت المدينة واطلب عبر واتساب">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16803c"><link rel="apple-touch-icon" href="icon-192.png"><meta property="og:title" content="سوبر ماركت المدينة"><meta property="og:description" content="اطلب مشترياتك أونلاين عبر واتساب"><meta property="og:image" content="icon-512.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><style>
:root{--g:#16803c;--r:#e32726;--bg:#f6f8f6;--c:#fff;--t:#16221a;--m:#667;--b:#dfe5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101611;--c:#1a231c;--t:#eef3ef;--m:#9aa;--b:#2c382e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif;font-size:17px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:3px solid var(--g);padding:8px 12px;display:flex;gap:10px;align-items:center}
header img{height:48px;border-radius:6px;background:#fff}
#q{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--b);border-radius:12px;background:var(--bg)}
.cartb{position:relative;background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800}
.cartb i{position:absolute;top:-6px;left:-6px;background:var(--r);border-radius:20px;font-style:normal;font-size:13px;padding:0 6px}
main{max-width:1100px;margin:auto;padding:12px}
.hero{background:linear-gradient(120deg,var(--g),#0f5c2a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
.hero b{font-size:26px;display:block}.hero span{background:var(--r);padding:2px 10px;border-radius:8px;font-weight:700}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.cat{flex:none;border:1.5px solid var(--b);background:var(--c);border-radius:14px;padding:10px 14px;font-weight:600;min-height:48px}
.cat.on{background:var(--g);color:#fff;border-color:var(--g)}
h2{margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.ph{font-size:56px;text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.nm{font-weight:700;min-height:2.6em;line-height:1.3}.pr{color:var(--g);font-weight:800;font-size:20px}.old{color:var(--m);text-decoration:line-through;font-size:14px;margin-inline-start:6px}
.dc{position:absolute;top:8px;right:8px;background:var(--r);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:700}
.st{font-size:14px;font-weight:600}.ok{color:var(--g)}.lo{color:#b86e00}.no{color:var(--r)}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--b);border-radius:10px}
.qty button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:800}
.add{background:var(--r);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800}.add:disabled{background:var(--b);color:var(--m)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px;font-weight:600}nav button b{display:block;font-size:20px}
#ov{position:fixed;inset:0;background:#0008;display:none;z-index:9}#ov.on{display:flex;align-items:flex-end;justify-content:center}
#sh{background:var(--c);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.f input,.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:10px;background:var(--bg);margin:4px 0 10px}
.tot{font-weight:800;font-size:19px}.big{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:18px;margin-top:8px}
.err{background:#e3272622;color:var(--r);border-radius:10px;padding:10px;margin:8px 0;font-weight:600}
footer{text-align:center;color:var(--m);padding:20px;font-size:14px}
#adm{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px}.at{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tb{border-collapse:collapse;width:100%;font-size:14px}.tb td,.tb th{border-bottom:1px solid var(--b);padding:6px;text-align:right}.tb input{width:70px;padding:6px;border:1px solid var(--b);border-radius:6px;background:var(--bg)}@media print{body>*:not(#adm){display:none!important}.np{display:none!important}#adm{position:static}}</style></head><body>

<script>
const sb=(window.MD&&MD.SUPABASE_URL&&window.supabase)?supabase.createClient(MD.SUPABASE_URL,MD.SUPABASE_ANON_KEY):null;
// ===== إعدادات المتجر (تُنقل لاحقاً إلى لوحة الإدارة / قاعدة البيانات) =====
const CONFIG={WHATSAPP_NUMBER:"",currency:"د.ل",deliveryOn:true,pickupOn:true,minOrder:20,freeAbove:150,
zones:[{n:"وسط المدينة",f:5},{n:"المنطقة 2",f:8},{n:"المنطقة 3",f:12}]};
// ===== بيانات تجريبية (DEMO) =====
const CATS=["الكل","العروض","مواد غذائية","مشروبات","ألبان","منظفات","عناية شخصية","مجمدات","معلبات","مخبوزات"];
let P=[
[1,"كوكاكولا 1.25 لتر","مشروبات",8.5,10,40,"🥤","عبوة",0],[2,"مياه معدنية 1.5 لتر","مشروبات",1.5,0,200,"💧","عبوة",0],
[3,"عصير برتقال 1 لتر","مشروبات",6,7.5,3,"🧃","عبوة",0],[4,"أرز بسمتي 5 كيلو","مواد غذائية",32,38,25,"🍚","كيس",0],
[5,"مكرونة سباغيتي 500 جرام","مواد غذائية",2.5,0,120,"🍝","عبوة",1],[6,"سكر أبيض 1 كيلو","مواد غذائية",3.5,0,80,"🍬","كيلو",0],
[7,"زيت دوار الشمس 1.8 لتر","مواد غذائية",18,21,0,"🛢️","عبوة",0],[8,"حليب طازج 1 لتر","ألبان",4.5,0,60,"🥛","عبوة",1],
[9,"جبنة شرائح 200 جرام","ألبان",7,8,4,"🧀","عبوة",0],[10,"زبادي طبيعي","ألبان",1.2,0,100,"🍶","عبوة",0],
[11,"سائل غسيل أطباق","منظفات",6.5,8,30,"🧴","عبوة",0],[12,"مسحوق غسيل 3 كيلو","منظفات",22,26,18,"🧺","كرتونة",0],
[13,"شامبو 400 مل","عناية شخصية",14,17,22,"🧼","عبوة",0],[14,"معجون أسنان","عناية شخصية",5,0,50,"🪥","قطعة",1],
[15,"بطاطس مجمدة 1 كيلو","مجمدات",9,11,15,"🍟","كيس",0],[16,"دجاج مجمد 1 كيلو","مجمدات",16,0,12,"🍗","كيلو",0],
[17,"تونة معلبة","معلبات",4.5,5.5,70,"🐟","علبة",0],[18,"طماطم معجون 800 جرام","معلبات",5,0,45,"🥫","علبة",0],
[19,"خبز تنور","مخبوزات",1,0,90,"🥖","حبة",1],[20,"كرواسون","مخبوزات",1.5,2,2,"🥐","حبة",1]
].map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],old:a[4],stock:a[5],ic:a[6],unit:a[7],isNew:a[8],min:5}));
let lim=40,LD=!!sb;let cat="الكل",term="",cart={},sel={};try{const sp=JSON.parse(localStorage.getItem("md_products")||"null");if(sp)P=sp;const sc=JSON.parse(localStorage.getItem("md_config")||"null");if(sc)Object.assign(CONFIG,sc)}catch(e){}
try{cart=JSON.parse(localStorage.getItem("md_cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id),fm=n=>(Math.round(n*100)/100)+" "+CONFIG.currency;
const save=()=>{try{localStorage.setItem("md_cart",JSON.stringify(cart))}catch(e){}};
const byId=id=>P.find(p=>p.id==id);
const stat=p=>p.stock<=0?["نفذت الكمية","no"]:p.stock<=p.min?["كمية محدودة ("+p.stock+")","lo"]:["متوفر","ok"];
function go(c){cat=c==="offers"?"العروض":"الكل";term="";$("q").value="";render();scrollTo(0,0)}
function match(p){if(p.hidden)return 0;if(cat==="العروض"&&!p.old)return 0;if(cat!=="الكل"&&cat!=="العروض"&&p.cat!==cat)return 0;
const t=term.trim();return !t||(p.name+p.cat+"MD"+p.id).includes(t)}
function card(p){const [s,c]=stat(p),d=p.old?Math.round((1-p.price/p.old)*100):0,q=sel[p.id]||1;
return `<div class="card">${d?`<span class="dc">خصم ${d}%</span>`:""}<div class="ph" onclick="det(${p.id})" style="cursor:pointer">${p.img?`<img src="${p.img}" alt="" loading="lazy" style="width:100%;height:80px;object-fit:contain">`:p.ic}</div><div class="nm" onclick="det(${p.id})" style="cursor:pointer">${p.name}</div>
<div><span class="pr">${fm(p.price)}</span>${p.old?`<span class="old">${fm(p.old)}</span>`:""}</div><div class="st ${c}">${s} · ${p.unit}</div>
<div class="qty"><button onclick="sq(${p.id},1)" aria-label="زيادة">+</button><b>${q}</b><button onclick="sq(${p.id},-1)" aria-label="نقصان">−</button></div>
<button class="add" ${p.stock<=0?"disabled":""} onclick="addC(${p.id})">${p.stock<=0?"غير متوفر حالياً":"إضافة للسلة"}</button></div>`}
function sq(id,d){sel[id]=Math.max(1,(sel[id]||1)+d);render()}
function addC(id){const p=byId(id),n=(cart[id]||0)+(sel[id]||1);
if(n>p.stock){alert("الكمية المطلوبة غير متوفرة حالياً. الكمية المتوفرة: "+p.stock);return}
cart[id]=n;sel[id]=1;save();render()}
function render(){if(LD){$("list").innerHTML=`<div class="grid">${'<div class="card" style="height:230px;opacity:.5"></div>'.repeat(8)}</div>`;return}$("cats").innerHTML=CATS.map(c=>`<button class="cat ${c===cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("");
const L=P.filter(match);let h="";
if(cat==="الكل"&&!term){const o=P.filter(p=>p.old&&!p.hidden).slice(0,5),n=P.filter(p=>p.isNew&&!p.hidden);
h+=`<h2>عروض اليوم</h2><div class="grid">${o.map(card).join("")}</div><h2>المنتجات الجديدة</h2><div class="grid">${n.map(card).join("")}</div><h2>جميع المنتجات</h2>`}
h+=L.length?`<div class="grid">${L.slice(0,lim).map(card).join("")}</div>${L.length>lim?`<button class="big" onclick="lim+=40;render()">عرض المزيد</button>`:""}`:`<p class="err">لم يتم العثور على منتجات</p>`;
$("list").innerHTML=h;ftr();$("cn").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
$("q").oninput=e=>{term=e.target.value;cat="الكل";render()};
function closeS(){$("ov").classList.remove("on")}function sheet(h){$("sh").innerHTML=h;$("ov").classList.add("on")}
const sub=()=>Object.entries(cart).reduce((a,[i,q])=>a+byId(i).price*q,0);
function openCart(){const ids=Object.keys(cart);
if(!ids.length){sheet(`<h2>السلة</h2><p>السلة فارغة</p><button class="big" onclick="closeS()">متابعة التسوق</button>`);return}
sheet(`<h2>السلة</h2>${ids.map(i=>{const p=byId(i);return `<div class="row"><div>${p.ic} ${p.name}<br><small>${fm(p.price)} × ${cart[i]}</small></div><div><b>${fm(p.price*cart[i])}</b><br><button onclick="cc(${i},1)">+</button> <button onclick="cc(${i},-1)">−</button></div></div>`}).join("")}
<div class="row tot"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div>
<button class="big" onclick="checkout()">إتمام الطلب</button><button class="cat" style="width:100%;margin-top:8px" onclick="if(confirm('تفريغ السلة؟')){cart={};save();render();closeS()}">تفريغ السلة</button>`)}
function cc(i,d){const p=byId(i),n=(cart[i]||0)+d;if(n>p.stock){alert("الكمية المتوفرة: "+p.stock);return}
if(n<=0)delete cart[i];else cart[i]=n;save();render();openCart()}
function fee(){const m=$("dm")?$("dm").value:"delivery";if(m!=="delivery"||sub()>=CONFIG.freeAbove)return 0;return CONFIG.zones[+($("zn")?$("zn").value:0)].f}
function upd(){const dl=$("dm").value==="delivery";$("dz").style.display=dl?"block":"none";$("tt").textContent=fm(sub()+fee());$("fe").textContent=fm(fee())}
function checkout(){sheet(`<h2>إتمام الطلب</h2><div class="f"><label>الاسم الكامل</label><input id="nm"><label>رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" placeholder="09XXXXXXXX">
<label>طريقة الاستلام</label><select id="dm" onchange="upd()">${CONFIG.deliveryOn?'<option value="delivery">توصيل للمنزل</option>':""}${CONFIG.pickupOn?'<option value="pickup">استلام من المتجر</option>':""}</select>
<div id="dz"><label>المنطقة</label><select id="zn" onchange="upd()">${CONFIG.zones.map((z,i)=>`<option value="${i}">${z.n} — ${z.f} ${CONFIG.currency}</option>`).join("")}</select><label>العنوان بالتفصيل</label><input id="ad"></div>
<label>ملاحظات الطلب</label><textarea id="nt" rows="2"></textarea></div><div id="er"></div>

for(let i=0;i<Math.max(L.length,CONFIG.zones.length);i++){const z=CONFIG.zones[i],l=L[i];

impC=async()=>{const rows=[];for(const l of $("csv").value.trim().split("\n").slice(1)){const c=l.split(",").map(s=>s.trim());if(!c[0]||!c[4])continue;
let ct=CAT.find(x=>x.name_ar===c[3]);if(!ct&&c[3]){const r=await sb.from('categories').insert({name_ar:c[3],slug:"c"+Date.now().toString(36)+rows.length}).select().single();if(r.data){ct=r.data;CAT.push(ct)}}
rows.push({name_ar:c[0],name_en:c[1]||null,sku:c[2]||"MD-"+Math.random().toString(36).slice(2,8).toUpperCase(),category_id:ct&&ct.id,price:+c[4],old_price:+c[5]||null,stock:+c[6]||0,unit:c[7]||"قطعة",description:c[8]||null,featured:c[9]==="1",active:c[10]!=="0"})}
if(ok(await sb.from('products').upsert(rows,{onConflict:'sku'})))alert("تم استيراد "+rows.length+" منتج");rf("p")};
const up=async f=>{const n="img/"+Date.now()+"-"+f.name.replace(/[^\w.]/g,"");const r=await sb.storage.from('product-images').upload(n,f);if(r.error){alert("تعذر رفع الصورة: "+r.error.message);return null}return sb.storage.from('product-images').getPublicUrl(n).data.publicUrl};
const nxt=a=>Math.max(0,...a.map(x=>x.sort||0))+1,tb=(h,r)=>`<div style="overflow-x:auto"><table class="tb"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r}</table></div>`;
window.pImg=async(id,f)=>{if(!f)return;const u=await up(f);if(u){ok(await sb.from('products').update({image_url:u}).eq('id',id));rf("p")}};
window.gAdd=async()=>{const n=$("g1").value.trim();if(n){ok(await sb.from('categories').insert({name_ar:n,slug:"c"+Date.now().toString(36),sort:nxt(CAT)}));rf("g")}};
window.gMv=async(i,d)=>{if(!CAT[i+d])return;const a=[...CAT];[a[i],a[i+d]]=[a[i+d],a[i]];for(let k=0;k<a.length;k++)await sb.from('categories').update({sort:k}).eq('id',a[k].id);rf("g")};
window.gRen=async id=>{const n=prompt("الاسم الجديد للقسم");if(n){ok(await sb.from('categories').update({name_ar:n}).eq('id',id));rf("g")}};
window.gTg=async(id,v)=>{ok(await sb.from('categories').update({active:v}).eq('id',id));rf("g")};
window.gDel=async id=>{if(!confirm("هل تريد حذف هذا القسم؟"))return;const r=await sb.from('categories').delete().eq('id',id);if(r.error){await sb.from('categories').update({active:false}).eq('id',id);alert("القسم مرتبط بمنتجات فتم إخفاؤه بدلاً من حذفه")}rf("g")};
window.bAdd=async()=>{const f=$("b4").files[0],u=f?await up(f):null,l=$("b3").value.trim();ok(await sb.from('banners').insert({title:$("b1").value,subtitle:$("b2").value,link:/^(https?:|\/|#)/.test(l)?l:null,button_text:l?"تسوق الآن":null,image_url:u,sort:nxt(BN)}));rf("b")};
window.bTg=async(id,v)=>{ok(await sb.from('banners').update({active:v}).eq('id',id));rf("b")};
window.bDel=async id=>{if(confirm("حذف البانر؟")){ok(await sb.from('banners').delete().eq('id',id));rf("b")}};
window.oAdd=async()=>{const p=+$("o2").value||null,a=+$("o3").value||null;if(!p&&!a)return alert("أدخل نسبة الخصم أو مبلغ الخصم");
ok(await sb.from('offers').insert({product_id:$("o1").value,percent:p,amount:a,starts_at:$("o4").value||null,ends_at:$("o5").value?$("o5").value+"T23:59:59":null}));rf("f")};
window.oTg=async(id,v)=>{ok(await sb.from('offers').update({active:v}).eq('id',id));rf("f")};
window.oDel=async id=>{ok(await sb.from('offers').delete().eq('id',id));rf("f")};
window.saveInfo=async()=>{for(const k of["phone","address","hours","facebook","instagram","tiktok","maps"])ok(await sb.from('store_settings').upsert({key:k,value:$("i_"+k).value.trim()}));alert("تم الحفظ");rf("s")};

if(t==="f")return `<div class="card f"><select id="o1">${P.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select><input id="o2" type="number" placeholder="نسبة الخصم %"><input id="o3" type="number" placeholder="أو مبلغ الخصم"><label>من تاريخ</label><input id="o4" type="date"><label>إلى تاريخ</label><input id="o5" type="date"><button class="big" onclick="oAdd()">إضافة عرض</button></div>`+tb(["المنتج","الخصم","ينتهي","إجراءات"],OF.map(f=>`<tr><td>${(byId(f.product_id)||{}).name||""}</td><td>${f.percent?f.percent+"%":fm(f.amount||0)}</td><td>${f.ends_at?new Date(f.ends_at).toLocaleDateString("ar-LY"):"-"}</td><td><button onclick="oTg(${f.id},${!f.active})">${f.active?"إيقاف":"تفعيل"}</button> <button onclick="oDel(${f.id})">حذف</button></td></tr>`).join(""));
if(t==="u"){const m={};OC.forEach(o=>{const c=m[o.phone]||(m[o.phone]={n:o.name,c:0,t:0});c.c++;c.t+=o.status==="ملغي"?0:o.total});return tb(["الاسم","الهاتف","الطلبات","الإجمالي"],Object.entries(m).map(e=>`<tr><td>${e[1].n}</td><td>${e[0]}</td><td>${e[1].c}</td><td>${fm(e[1].t)}</td></tr>`).join(""))}
if(t==="r"){const d=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return x}),v=d.map(x=>OC.filter(o=>o.status!=="ملغي"&&new Date(o.date).toDateString()===x.toDateString()).reduce((a,o)=>a+o.total,0)),m=Math.max(1,...v),tp={};
OC.filter(o=>o.status!=="ملغي").forEach(o=>o.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.q));
return `<div class="card"><b>مبيعات آخر 7 أيام</b><div style="display:flex;gap:6px;align-items:flex-end;margin-top:8px">${v.map((a,i)=>`<div style="flex:1;text-align:center;font-size:11px"><div style="background:var(--g);height:${a/m*90}px;border-radius:4px"></div>${d[i].getDate()}<br>${Math.round(a)}</div>`).join("")}</div></div><div class="card" style="margin-top:8px"><b>الأكثر مبيعاً</b>${Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>`<div class="row"><span>${e[0]}</span><b>${e[1]}</b></div>`).join("")||"<p>لا توجد بيانات</p>"}</div>`}
return""};
