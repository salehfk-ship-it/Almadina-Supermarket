<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سوبر ماركت المدينة</title>
  <style>
    :root {
      --g:#16803c; --r:#e32726; --bg:#f6f8f6; --c:#fff; --t:#16221a; --m:#667; --b:#dfe5e0;
      --shadow:0 16px 32px rgba(16,29,21,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif;font-size:17px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    header{position:sticky;top:0;z-index:20;background:var(--c);border-bottom:3px solid var(--g);padding:10px 12px;display:flex;align-items:center;gap:10px}
    header img{height:48px;border-radius:8px;background:#fff}
    #q{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--b);border-radius:12px;background:var(--bg)}
    .cartb{position:relative;background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800}
    .cartb i{position:absolute;top:-6px;left:-6px;background:var(--r);border-radius:20px;font-style:normal;font-size:13px;padding:0 6px;min-width:18px;text-align:center}
    main{max-width:1100px;margin:auto;padding:12px}
    .hero{background:linear-gradient(120deg,var(--g),#0f5c2a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
    .hero b{font-size:26px;display:block}.hero span{background:var(--r);padding:2px 10px;border-radius:8px;font-weight:700}
    .cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
    .cat{flex:none;border:1.5px solid var(--b);background:var(--c);border-radius:14px;padding:10px 14px;font-weight:600;min-height:48px}
    .cat.on{background:var(--g);color:#fff;border-color:var(--g)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
    .card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:0 2px 8px rgba(16,29,21,.02)}
    .ph{font-size:56px;text-align:center;background:var(--bg);border-radius:10px;padding:8px;min-height:76px;display:grid;place-items:center}
    .nm{font-weight:700;min-height:2.7em;line-height:1.3}
    .pr{color:var(--g);font-weight:800;font-size:20px}.old{color:var(--m);text-decoration:line-through;font-size:14px;margin-inline-start:6px}
    .dc{position:absolute;top:8px;right:8px;background:var(--r);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:700}
    .st{font-size:14px;font-weight:600}.ok{color:var(--g)}.lo{color:#b86e00}.no{color:var(--r)}
    .weight-box{display:grid;gap:4px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:8px}
    .weight-box span{font-size:12px;color:var(--m);font-weight:700}
    .weight-box input{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:#fff}
    .qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--b);border-radius:10px}
    .qty button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:800}
    .add{background:var(--r);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800}.add:disabled{background:var(--b);color:var(--m)}
    nav{position:fixed;bottom:0;inset-inline:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
    nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px;font-weight:600}nav button b{display:block;font-size:20px}
    #ov{position:fixed;inset:0;background:#0008;display:none;z-index:9}#ov.on{display:flex;align-items:flex-end;justify-content:center}
    #sh{background:var(--c);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
    .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
    .f input,.f select,.f textarea{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:10px;background:var(--bg);margin:4px 0 10px}
    .tot{font-weight:800;font-size:19px}.big{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:18px;margin-top:8px}
    .err{background:#e3272622;color:var(--r);border-radius:10px;padding:10px;margin:8px 0;font-weight:600}
    footer{text-align:center;color:var(--m);padding:20px;font-size:14px}
    .mini{font-size:12px;opacity:.8}
  </style>
</head>
<body>
  <header>
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAfCAYAAAAA37VbAAAAAXNSR0IAr+sLqQAAAA1JREFUGFdjYAAAAAIAAeIhvAAAAABJRU5ErkJggg==" alt="logo"/>
    <input id="q" placeholder="ابحث عن منتج..." aria-label="بحث">
    <button class="cartb" type="button" onclick="openCart()">🛒 <i id="cn">0</i></button>
  </header>
  <main>
    <div id="hb"></div>
    <div class="hero"><b>سوبر ماركت المدينة</b>خياراتك الأفضل — اطلب الآن واستلم في بيتك <span>توصيل سريع</span></div>
    <div class="cats" id="cats"></div>
    <div id="list" class="grid"></div>
  </main>
  <footer>
    <div id="ft"></div><br>
    سوبر ماركت المدينة · ALMADINA SUPERMARKET
  </footer>
  <nav>
    <button onclick="go('')"><b>🏠</b>الرئيسية</button>
    <button onclick="go('')"><b>▦</b>الأقسام</button>
    <button onclick="go('offers')"><b>%</b>العروض</button>
    <button onclick="openCart()"><b>🛒</b>السلة</button>
  </nav>
  <div id="ov" onclick="if(event.target==this)closeS()"><div id="sh"></div></div>
  <script>
    const sb = (window.MD && window.MD.SUPABASE_URL && window.supabase) ? window.supabase.createClient(window.MD.SUPABASE_URL, window.MD.SUPABASE_ANON_KEY) : null;
    const CONFIG = {WHATSAPP_NUMBER:'',currency:'د.ل',deliveryOn:true,pickupOn:true,minOrder:20,freeAbove:150, zones:[{n:'وسط المدينة',f:5},{n:'المنطقة 2',f:8},{n:'المنطقة 3',f:12}]};
    const CATS = ['الكل','العروض','مواد غذائية','مشروبات','ألبان','منظفات','عناية شخصية','مجمدات','معلبات','مخبوزات','البقوليات'];
    let P = [
      {id:1,name:'كوكاكولا 1.25 لتر',cat:'مشروبات',price:8.5,old:10,stock:40,ic:'🥤',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:2,name:'مياه معدنية 1.5 لتر',cat:'مشروبات',price:1.5,old:0,stock:200,ic:'💧',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:3,name:'عصير برتقال 1 لتر',cat:'مشروبات',price:6,old:7.5,stock:3,ic:'🧃',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:4,name:'أرز بسمتي 5 كيلو',cat:'مواد غذائية',price:32,old:38,stock:25,ic:'🍚',unit:'كيس',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:5,name:'مكرونة سباغيتي 500 جرام',cat:'مواد غذائية',price:2.5,old:0,stock:120,ic:'🍝',unit:'عبوة',isNew:1,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:6,name:'سكر أبيض 1 كيلو',cat:'مواد غذائية',price:3.5,old:0,stock:80,ic:'🍬',unit:'كيلو',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:7,name:'زيت دوار الشمس 1.8 لتر',cat:'مواد غذائية',price:18,old:21,stock:0,ic:'🛢️',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:8,name:'حليب طازج 1 لتر',cat:'ألبان',price:4.5,old:0,stock:60,ic:'🥛',unit:'عبوة',isNew:1,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:9,name:'جبنة شرائح 200 جرام',cat:'ألبان',price:7,old:8,stock:4,ic:'🧀',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:10,name:'زبادي طبيعي',cat:'ألبان',price:1.2,old:0,stock:100,ic:'🍶',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:11,name:'سائل غسيل أطباق',cat:'منظفات',price:6.5,old:8,stock:30,ic:'🧴',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:12,name:'مسحوق غسيل 3 كيلو',cat:'منظفات',price:22,old:26,stock:18,ic:'🧺',unit:'كرتونة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:13,name:'شامبو 400 مل',cat:'عناية شخصية',price:14,old:17,stock:22,ic:'🧼',unit:'عبوة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:14,name:'معجون أسنان',cat:'عناية شخصية',price:5,old:0,stock:50,ic:'🪥',unit:'قطعة',isNew:1,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:15,name:'بطاطس مجمدة 1 كيلو',cat:'مجمدات',price:9,old:11,stock:15,ic:'🍟',unit:'كيس',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:16,name:'دجاج مجمد 1 كيلو',cat:'مجمدات',price:16,old:0,stock:12,ic:'🍗',unit:'كيلو',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:17,name:'تونة معلبة',cat:'معلبات',price:4.5,old:5.5,stock:70,ic:'🐟',unit:'علبة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:18,name:'طماطم معجون 800 جرام',cat:'معلبات',price:5,old:0,stock:45,ic:'🥫',unit:'علبة',isNew:0,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:19,name:'خبز تنور',cat:'مخبوزات',price:1,old:0,stock:90,ic:'🥖',unit:'حبة',isNew:1,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100},
      {id:20,name:'كرواسون',cat:'مخبوزات',price:1.5,old:2,stock:2,ic:'🥐',unit:'حبة',isNew:1,min:5,isWeighted:false,pricePerKg:0,minWeight:250,weightStep:100}
    ];
    let cart = JSON.parse(localStorage.getItem('md_cart') || '{}');
    let sel = JSON.parse(localStorage.getItem('md_sel') || '{}');
    let activeCat = 'الكل';
    let q = '';
    function fm(v){ return Number(v || 0).toFixed(2) + ' ' + CONFIG.currency; }
    function byId(id){ return P.find(p => Number(p.id) === Number(id)); }
    function save(){
      try{localStorage.setItem('md_cart', JSON.stringify(cart)); localStorage.setItem('md_sel', JSON.stringify(sel));}catch(e){}
    }
    function cleanSel(){
      for (const id of Object.keys(sel)) {
        const p = byId(id);
        if (!p) delete sel[id];
      }
    }
    function go(cat){ activeCat = cat || 'الكل'; renderCats(); renderList(); }
    function getPrice(p){ return p.isWeighted ? (Number(p.pricePerKg) || Number(p.price) || 0) : Number(p.price || 0); }
    function getUnitName(p){ return p.isWeighted ? 'جرام' : (p.unit || 'قطعة'); }
    function getSelectedGrams(id){
      const p = byId(id); if (!p || !p.isWeighted) return 0;
      const current = sel[id];
      return Number(current && typeof current === 'object' ? current.grams : (current || p.minWeight || 250)) || (p.minWeight || 250);
    }
    function setSelectedGrams(id, grams){
      const p = byId(id); if (!p || !p.isWeighted) return;
      const min = Number(p.minWeight || 250);
      const safe = Number(grams || min);
      sel[id] = {grams: Math.max(min, safe), isWeighted: true}; save(); renderList();
    }
    function updateCartCount(){
      const count = Object.values(cart).reduce((sum, item) => {
        if (typeof item === 'object') return sum + Number(item.grams || 0);
        return sum + Number(item || 0);
      }, 0);
      document.getElementById('cn').textContent = count > 0 ? count : '0';
    }
    function renderCats(){
      const cats = ['الكل','العروض'].concat(CATS.filter(c => c !== 'الكل' && c !== 'العروض'));
      const el = document.getElementById('cats');
      el.innerHTML = cats.map(c => `<button class="cat ${activeCat===c?'on':''}" onclick="go('${c}')">${c}</button>`).join('');
    }
    function padProduct(p){
      const cur = cart[p.id];
      const n = (typeof cur === 'object') ? Number(cur.grams || 0) : Number(cur || 0);
      const weighted = !!p.isWeighted;
      const activePrice = weighted ? fm(Number(p.pricePerKg || p.price || 0)) + ' / كجم' : fm(p.price || 0);
      const stockLabel = weighted ? `${Math.max(0, Number(p.stock || 0))} جرام` : `${Math.max(0, Number(p.stock || 0))} ${p.unit || 'قطعة'}`;
      const qtyText = weighted ? `${getSelectedGrams(p.id)} جرام` : `${n || 0}`;
      const weightInput = weighted ? `<label class="weight-box"><span>الوزن (جرام)</span><input type="number" min="${p.minWeight || 250}" step="${p.weightStep || 100}" value="${getSelectedGrams(p.id)}" onchange="setSelectedGrams(${p.id}, this.value)"></label>` : '';
      return `
        <div class="card">
          ${p.old ? `<span class="dc">خصم ${Math.round(((p.old - p.price) / p.old) * 100)}%</span>` : ''}
          <div class="ph">${p.ic || '📦'}</div>
          <div class="nm">${p.name}</div>
          <div><span class="pr">${activePrice}</span>${p.old ? `<span class="old">${fm(p.old)}</span>`:''}</div>
          <div class="st ${p.stock <= 5 ? 'lo' : 'ok'}">${p.stock > 0 ? 'متوفر' : 'غير متوفر'} · ${stockLabel}</div>
          ${weightInput}
          <div class="qty">
            <button type="button" onclick="step(${p.id},-1)">−</button>
            <b>${qtyText}</b>
            <button type="button" onclick="step(${p.id},1)">+</button>
          </div>
          <button class="add" type="button" onclick="addC(${p.id})" ${p.stock <= 0 ? 'disabled' : ''}>أضف للسلة</button>
        </div>
      `;
    }
    function step(id, delta){
      const p = byId(id); if (!p) return;
      if (p.isWeighted) {
        const min = Number(p.minWeight || 250);
        const stepSize = Number(p.weightStep || 100);
        const current = getSelectedGrams(id);
        const next = Math.max(min, current + delta * stepSize);
        setSelectedGrams(id, next);
        return;
      }
      const current = Number(cart[id] || 0);
      const next = Math.max(0, current + delta);
      if (next > 0) cart[id] = next; else delete cart[id];
      save(); renderList(); updateCartCount();
    }
    function addC(id){
      const p = byId(id); if (!p) return;
      if (p.isWeighted) {
        const grams = Math.max(Number(p.minWeight || 250), Number(getSelectedGrams(id) || p.minWeight || 250));
        if (grams > Number(p.stock || 0)) { alert('الوزن المطلوب أكبر من المخزون المتاح. المتاح: ' + p.stock + ' جرام'); return; }
        cart[id] = {grams, isWeighted:true};
        save(); renderCart(); updateCartCount();
        return;
      }
      const qty = Number(cart[id] || 0) + 1;
      if (qty > Number(p.stock || 0)) { alert('الكمية المطلوبة غير متوفرة حالياً'); return; }
      cart[id] = qty; save(); renderCart(); updateCartCount();
    }
    function openCart(){
      renderCart();
      document.getElementById('ov').classList.add('on');
      document.getElementById('sh').innerHTML = renderCartHtml();
    }
    function closeS(){ document.getElementById('ov').classList.remove('on'); }
    function renderCart(){
      const html = renderCartHtml();
      document.getElementById('sh').innerHTML = html;
      updateCartCount();
    }
    function renderCartHtml(){
      const entries = Object.entries(cart);
      if (!entries.length) {
        return `<h2>السلة</h2><p>السلة فارغة الآن.</p><button class="big" onclick="closeS()">متابعة التسوق</button>`;
      }
      let subtotal = 0;
      const items = entries.map(([id, value]) => {
        const p = byId(id); if (!p) return '';
        let itemTotal = 0; let summary = '';
        if (p.isWeighted) {
          const grams = Number(value && typeof value === 'object' ? value.grams : value || 0);
          itemTotal = (grams / 1000) * (Number(p.pricePerKg || p.price || 0));
          summary = `${grams} جرام`;
        } else {
          const qty = Number(value || 0);
          itemTotal = Number(p.price || 0) * qty;
          summary = `${qty} ${p.unit || 'قطعة'}`;
        }
        subtotal += itemTotal;
        return `<div class="row"><div><b>${p.name}</b><div class="mini">${summary}</div></div><div>${fm(itemTotal)}</div></div>`;
      }).join('');
      const fee = subtotal >= CONFIG.freeAbove ? 0 : entries.some(([id]) => { const p=byId(id); return p && !p.isWeighted; }) ? 0 : 0;
      const total = subtotal + fee;
      return `
        <h2>سلة المشتريات</h2>
        ${items}
        <div class="row"><span>المجموع الفرعي</span><span>${fm(subtotal)}</span></div>
        <div class="row"><span>التوصيل</span><span>${fm(fee)}</span></div>
        <div class="row tot"><span>الإجمالي النهائي</span><span>${fm(total)}</span></div>
        <button class="big" onclick="checkout()">إتمام الطلب</button>
      `;
    }
    function checkout(){
      const html = `
        <h2>إتمام الطلب</h2>
        <div class="f">
          <label>الاسم الكامل<input id="nm"></label>
          <label>رقم الهاتف<input id="ph" type="tel" inputmode="tel" placeholder="09XXXXXXXX"></label>
          <label>طريقة الاستلام<select id="dm" onchange="upd()"><option value="delivery">توصيل للمنزل</option><option value="pickup">استلام من المتجر</option></select></label>
          <div id="dz">
            <label>المنطقة<select id="zn">${CONFIG.zones.map((z,i)=>`<option value="${i}">${z.n} — ${z.f} ${CONFIG.currency}</option>`).join('')}</select></label>
            <label>العنوان بالتفصيل<input id="ad"></label>
          </div>
          <label>ملاحظات الطلب<textarea id="nt" rows="2"></textarea></label>
          <div id="er"></div>
          <div class="row"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div>
          <div class="row"><span>التوصيل</span><span id="fe">${fm(fee())}</span></div>
          <div class="row tot"><span>الإجمالي النهائي</span><span id="tt">${fm(sub()+fee())}</span></div>
          <button class="big" onclick="send()">إرسال الطلب عبر واتساب</button>
        </div>
      `;
      document.getElementById('sh').innerHTML = html;
      window.upd = function(){
        const dl = document.getElementById('dm').value === 'delivery';
        document.getElementById('dz').style.display = dl ? 'block' : 'none';
        const total = sub() + fee();
        document.getElementById('tt').textContent = fm(total);
        document.getElementById('fe').textContent = fm(fee());
      };
      window.upd();
    }
    function sub(){
      let total = 0;
      Object.entries(cart).forEach(([id, value]) => {
        const p = byId(id); if (!p) return;
        if (p.isWeighted) {
          const grams = Number(value && typeof value === 'object' ? value.grams : value || 0);
          total += (grams / 1000) * (Number(p.pricePerKg || p.price || 0));
        } else {
          total += Number(p.price || 0) * Number(value || 0);
        }
      });
      return total;
    }
    function fee(){
      const z = CONFIG.zones[Number(document.getElementById('zn')?.value || 0)] || {f:0};
      return sub() >= CONFIG.freeAbove ? 0 : (document.getElementById('dm') && document.getElementById('dm').value === 'delivery') ? z.f : 0;
    }
    function send(){
      const nm = document.getElementById('nm').value.trim();
      const ph = document.getElementById('ph').value.trim();
      const dl = document.getElementById('dm').value === 'delivery';
      const ad = document.getElementById('ad').value.trim();
      const nt = document.getElementById('nt').value.trim();
      const z = CONFIG.zones[Number(document.getElementById('zn')?.value || 0)] || {n:'',f:0};
      if (!nm || !ph) { document.getElementById('er').innerHTML = '<div class="err">يرجى إدخال الاسم ورقم الهاتف</div>'; return; }
      let m = `*طلب جديد - سوبر ماركت المدينة*\n\nرقم الطلب: #${Date.now().toString().slice(-6)}\n\n*بيانات العميل:*\nالاسم: ${nm}\nالهاتف: ${ph}\n`;
      if (dl) m += `المنطقة: ${z.n}\nالعنوان: ${ad}\n`;
      m += `طريقة الاستلام: ${dl ? 'توصيل' : 'استلام من المتجر'}\n\n*المنتجات:*\n\n`;
      Object.entries(cart).forEach(([id, value], index) => {
        const p = byId(id); if (!p) return;
        if (p.isWeighted) {
          const grams = Number(value && typeof value === 'object' ? value.grams : value || 0);
          const price = (grams / 1000) * (Number(p.pricePerKg || p.price || 0));
          m += `${index + 1}. ${p.name}\nالوزن: ${grams} جرام\nسعر الكيلو: ${fm(p.pricePerKg || p.price || 0)}\nالإجمالي: ${fm(price)}\n\n`;
        } else {
          const qty = Number(value || 0);
          const price = qty * Number(p.price || 0);
          m += `${index + 1}. ${p.name}\nالكمية: ${qty}\nسعر الوحدة: ${fm(p.price)}\nالإجمالي: ${fm(price)}\n\n`;
        }
      });
      m += `--------------------\nالمجموع الفرعي: ${fm(sub())}\nالتوصيل: ${fm(fee())}\nالإجمالي النهائي: ${fm(sub() + fee())}\n\nملاحظات:\n${nt || '-'}`;
      const url = 'https://wa.me/' + CONFIG.WHATSAPP_NUMBER.replace(/\D/g, '') + '?text=' + encodeURIComponent(m);
      window.open(url, '_blank');
    }
    function renderList(){
      const term = document.getElementById('q').value.trim().toLowerCase();
      const filtered = P.filter(p => {
        const catOk = activeCat === 'الكل' || activeCat === 'العروض' ? true : p.cat === activeCat;
        const offerOk = activeCat === 'العروض' ? !!p.old : true;
        const textOk = !term || p.name.toLowerCase().includes(term);
        return catOk && offerOk && textOk;
      });
      document.getElementById('list').innerHTML = filtered.map(p => padProduct(p)).join('');
      updateCartCount();
    }
    function loadSupabaseProducts(){
      if (!sb) return;
      sb.from('products').select('*').eq('active', true).order('id').then(({data, error}) => {
        if (error || !data) return;
        P = data.map(p => ({
          id: p.id,
          name: p.name_ar,
          cat: p.category_id ? 'مواد غذائية' : 'مواد غذائية',
          price: Number(p.price || 0),
          old: Number(p.old_price || 0),
          stock: Number(p.stock || 0),
          ic: p.image_url ? '🛒' : (p.emoji || '📦'),
          unit: p.unit || 'قطعة',
          isWeighted: !!p.is_weighted,
          pricePerKg: Number(p.price_per_kg || p.price || 0),
          minWeight: Number(p.min_weight_grams || 250),
          weightStep: Number(p.weight_step_grams || 100),
          isNew: 0,
          min: Number(p.min_stock || 5),
          active: p.active
        }));
        renderCats(); renderList();
      }).catch(()=>{});
    }
    function init(){
      cleanSel();
      renderCats();
      renderList();
      document.getElementById('q').addEventListener('input', renderList);
      loadSupabaseProducts();
    }
    init();
  </script>
</body>
</html>
