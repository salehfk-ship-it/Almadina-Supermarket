<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سوبر ماركت المدينة</title>
  <style>
    :root {
      --g: #16803c;
      --r: #e32726;
      --bg: #f6f8f6;
      --c: #fff;
      --t: #16221a;
      --m: #667;
      --b: #dfe5e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font-family: Cairo, Tahoma, sans-serif;
      font-size: 17px;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header {
      position: sticky; top: 0; z-index: 5;
      background: var(--c); border-bottom: 3px solid var(--g);
      padding: 8px 12px; display: flex; gap: 10px; align-items: center;
    }
    header img { height: 48px; border-radius: 6px; background: #fff; }
    #q { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--b); border-radius: 12px; background: var(--bg); }
    .cartb { position: relative; background: var(--g); color: #fff; border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; }
    .cartb i { position: absolute; top: -6px; left: -6px; background: var(--r); border-radius: 20px; font-style: normal; font-size: 13px; padding: 0 6px; }
    main { max-width: 1100px; margin: auto; padding: 12px; }
    .hero { background: linear-gradient(120deg,var(--g),#0f5c2a); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .hero b { font-size: 26px; display: block; }
    .hero span { background: var(--r); padding: 2px 10px; border-radius: 8px; font-weight: 700; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
    .cat { flex: none; border: 1.5px solid var(--b); background: var(--c); border-radius: 14px; padding: 10px 14px; font-weight: 600; min-height: 48px; }
    .cat.on { background: var(--g); color: #fff; border-color: var(--g); }
    h2 { margin: 14px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width:700px){ .grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width:1000px){ .grid { grid-template-columns: repeat(5,1fr); } }
    .card { background: var(--c); border: 1px solid var(--b); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
    .ph { font-size: 56px; text-align: center; background: var(--bg); border-radius: 10px; padding: 8px; }
    .nm { font-weight: 700; min-height: 2.6em; line-height: 1.3; }
    .pr { color: var(--g); font-weight: 800; font-size: 20px; }
    .old { color: var(--m); text-decoration: line-through; font-size: 14px; margin-inline-start: 6px; }
    .dc { position: absolute; top: 8px; right: 8px; background: var(--r); color: #fff; border-radius: 8px; padding: 0 8px; font-size: 13px; font-weight: 700; }
    .st { font-size: 14px; font-weight: 600; }
    .ok { color: var(--g); }
    .lo { color: #b86e00; }
    .no { color: var(--r); }
    .qty { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--b); border-radius: 10px; }
    .qty button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; font-weight: 800; }
    .add { background: var(--r); color: #fff; border: 0; border-radius: 10px; padding: 12px; font-weight: 800; }
    .add:disabled { background: var(--b); color: var(--m); }
    nav { position: fixed; bottom: 0; inset-inline: 0; background: var(--c); border-top: 1px solid var(--b); display:flex; padding-bottom: env(safe-area-inset-bottom,0px); z-index:5; }
    nav button { flex: 1; border:0; background:none; padding:10px 2px; font-size:14px; font-weight:600; }
    nav button b { display:block; font-size:20px; }
    #ov { position:fixed; inset:0; background:#0008; display:none; z-index:9; }
    #ov.on { display:flex; align-items:flex-end; justify-content:center; }
    #sh { background:var(--c); width:100%; max-width:560px; max-height:92%; overflow:auto; border-radius:20px 20px 0 0; padding:16px; }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--b); }
    .f input, .f select, .f textarea { width:100%; padding:12px; border:1.5px solid var(--b); border-radius:10px; background: var(--bg); margin: 4px 0 10px; }
    .tot { font-weight:800; font-size:19px; }
    .big { width:100%; background:var(--g); color:#fff; border:0; border-radius:12px; padding:15px; font-weight:800; font-size:18px; margin-top:8px; }
    .err { background:#e3272622; color:var(--r); border-radius:10px; padding:10px; margin:8px 0; font-weight:600; }
    footer { text-align:center; color:var(--m); padding:20px; font-size:14px; }
    .mini { font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>
  <header>
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4RbURXhpZgAASUkqAAgAAAAEABIBAwABAAAAAQAAADEBAgAHAAAAPgAAABICAwACAAAAAgACAGmHBAABAAAARgAAANQAAABQaWNhc2EAAAYAAJAHAAQAAAAwMjIwAaA" alt="logo">
    <input id="q" placeholder="ابحث عن منتج..." aria-label="بحث">
    <button class="cartb" type="button" onclick="openCart()">🛒 <i id="cn">0</i></button>
  </header>
  <main>
    <div id="hb"></div>
    <div class="hero"><b>سوبر ماركت المدينة</b>خياراتك الأفضل — اطلب الآن واستلم في بيتك <span>توصيل سريع</span></div>
    <div class="cats" id="cats"></div>
    <div id="list"></div>
  </main>
  <footer><div id="ft"></div><a href="#" onclick="openAdm();return false" style="color:var(--g);font-weight:700">دخول الإدارة</a><br>سوبر ماركت المدينة · ALMADINA SUPERMARKET</footer>
  <nav>
    <button onclick="go('')"><b>🏠</b>الرئيسية</button>
    <button onclick="go('')"><b>▦</b>الأقسام</button>
    <button onclick="go('offers')"><b>%</b>العروض</button>
    <button onclick="openCart()"><b>🛒</b>السلة</button>
  </nav>
  <div id="adm" style="display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px;"></div>
  <div id="ov" onclick="if(event.target==this)closeS()"><div id="sh"></div></div>
  <script>
    const CONFIG = { WHATSAPP_NUMBER: "", currency: "د.ل", deliveryOn: true, pickupOn: true, minOrder: 20, freeAbove: 150, zones:[{n:"وسط المدينة",f:5},{n:"المنطقة 2",f:8},{n:"المنطقة 3",f:12}] };
    const CATS = ["الكل","العروض","مواد غذائية","مشروبات","ألبان","منظفات","عناية شخصية","مجمدات","معلبات","مخبوزات","البقوليات"];
    let P = [
      [1,"كوكاكولا 1.25 لتر","مشروبات",8.5,10,40,"🥤","عبوة",0],
      [2,"مياه معدنية 1.5 لتر","مشروبات",1.5,0,200,"💧","عبوة",0],
      [3,"عصير برتقال 1 لتر","مشروبات",6,7.5,3,"🧃","عبوة",0],
      [4,"أرز بسمتي 5 كيلو","مواد غذائية",32,38,25,"🍚","كيس",0],
      [5,"مكرونة سباغيتي 500 جرام","مواد غذائية",2.5,0,120,"🍝","عبوة",1],
      [6,"سكر أبيض 1 كيلو","مواد غذائية",3.5,0,80,"🍬","كيلو",0],
      [7,"زيت دوار الشمس 1.8 لتر","مواد غذائية",18,21,0,"🛢️","عبوة",0],
      [8,"حليب طازج 1 لتر","ألبان",4.5,0,60,"🥛","عبوة",1],
      [9,"جبنة شرائح 200 جرام","ألبان",7,8,4,"🧀","عبوة",0],
      [10,"زبادي طبيعي","ألبان",1.2,0,100,"🍶","عبوة",0],
      [11,"سائل غسيل أطباق","منظفات",6.5,8,30,"🧴","عبوة",0],
      [12,"مسحوق غسيل 3 كيلو","منظفات",22,26,18,"🧺","كرتونة",0],
      [13,"شامبو 400 مل","عناية شخصية",14,17,22,"🧼","عبوة",0],
      [14,"معجون أسنان","عناية شخصية",5,0,50,"🪥","قطعة",1],
      [15,"بطاطس مجمدة 1 كيلو","مجمدات",9,11,15,"🍟","كيس",0],
      [16,"دجاج مجمد","مجمدات",16,0,5000,"🍗","كيلو",0],
      [17,"تونة معلبة","معلبات",4.5,5.5,70,"🐟","علبة",0],
      [18,"طماطم معجون 800 جرام","معلبات",5,0,45,"🥫","علبة",0],
      [19,"خبز تنور","مخبوزات",1,0,90,"🥖","حبة",1],
      [20,"كرواسون","مخبوزات",1.5,2,2,"🥐","حبة",1]
    ].map(a => ({
      id: a[0],
      name: a[1],
      cat: a[2],
      price: a[3],
      old: a[4],
      stock: a[5],
      ic: a[6],
      unit: a[7],
      isNew: a[8],
      min: 5,
      isWeighted: a[0] === 16,
      minWeight: a[0] === 16 ? 250 : 0,
      weightStep: a[0] === 16 ? 100 : 1,
      pricePerKg: a[0] === 16 ? a[3] : a[3]
    }));
    let cart = {}, sel = {};
    try {
      const sc = JSON.parse(localStorage.getItem("md_cart") || "{}");
      if (sc) cart = sc;
    } catch (e) {}
    const $ = id => document.getElementById(id);
    const fm = n => (Math.round((n || 0) * 100) / 100) + " " + CONFIG.currency;
    const save = () => { try { localStorage.setItem("md_cart", JSON.stringify(cart)); } catch (e) {} };
    const byId = id => P.find(p => Number(p.id) === Number(id));
    const stat = p => p.stock <= 0 ? ["نفذت الكمية", "no"] : p.stock <= p.min ? ["كمية محدودة (" + p.stock + ")", "lo"] : ["متوفر", "ok"];
    const productDisplayUnit = p => p.isWeighted ? "جرام" : (p.unit || "قطعة");
    const getSelectionAmount = p => {
      if (p.isWeighted) {
        const raw = sel[p.id];
        if (raw && typeof raw === "object") return Number(raw.grams || p.minWeight || 1000);
        return Number(p.minWeight || 1000);
      }
      return Number(sel[p.id] || 1);
    };
    const getCartInfo = id => {
      const p = byId(id);
      const entry = cart[id];
      if (!p) return { grams: 0, qty: 0, itemTotal: 0, isWeighted: false };
      if (p.isWeighted) {
        const grams = (entry && typeof entry === "object") ? Number(entry.grams || 0) : Number(entry || 0);
        return { grams, qty: grams, itemTotal: (grams / 1000) * p.price, isWeighted: true };
      }
      const qty = Number(typeof entry === "object" ? (entry.qty || 0) : (entry || 0));
      return { grams: 0, qty, itemTotal: qty * p.price, isWeighted: false };
    };
    function go(c) { cat = c === "offers" ? "العروض" : "الكل"; term = ""; $("q").value = ""; render(); scrollTo(0, 0); }
    let cat = "الكل", term = "", lim = 40;
    function match(p) {
      if (p.hidden) return 0;
      if (cat === "العروض" && !p.old) return 0;
      if (cat !== "الكل" && cat !== "العروض" && p.cat !== cat) return 0;
      const t = term.trim();
      return !t || (p.name + p.cat + "MD" + p.id + (p.bc || "")).includes(t);
    }
    function card(p) {
      const [s, c] = stat(p);
      const d = p.old ? Math.round((1 - p.price / p.old) * 100) : 0;
      const amount = getSelectionAmount(p);
      const qtyText = p.isWeighted ? amount + " جرام" : amount;
      const addText = p.isWeighted ? "إضافة للوزن" : "إضافة للسلة";
      return `<div class="card">
        ${d ? `<span class="dc">خصم ${d}%</span>` : ""}
        <div class="ph">${p.ic}</div>
        <div class="nm">${p.name}</div>
        <div><span class="pr">${fm(p.price)}${p.isWeighted ? "/كجم" : ""}</span>${p.old ? `<span class="old">${fm(p.old)}</span>` : ""}</div>
        <div class="st ${c}">${s} · ${productDisplayUnit(p)}</div>
        <div class="mini">${p.isWeighted ? `سعر الكيلو: ${fm(p.price)} · الوزن الحالي: ${qtyText}` : `الكمية الحالية: ${qtyText}`}</div>
        <div class="qty">
          <button onclick="sq(${p.id},-1)" aria-label="نقصان">−</button>
          <b>${qtyText}</b>
          <button onclick="sq(${p.id},1)" aria-label="زيادة">+</button>
        </div>
        <button class="add" ${p.stock <= 0 ? "disabled" : ""} onclick="addC(${p.id})">${p.stock <= 0 ? "غير متوفر حالياً" : addText}</button>
      </div>`;
    }
    function sq(id, d) {
      const p = byId(id);
      if (!p) return;
      if (p.isWeighted) {
        const step = Number(p.weightStep || 100);
        const current = getSelectionAmount(p);
        const next = Math.max(Number(p.minWeight || 100), current + (d * step));
        sel[id] = { grams: next, isWeighted: true };
      } else {
        sel[id] = Math.max(1, Number(sel[id] || 1) + d);
      }
      render();
    }
    function addC(id) {
      const p = byId(id);
      if (!p) return;
      if (p.stock <= 0) {
        alert("الكمية المطلوبة غير متوفرة حالياً.");
        return;
      }
      if (p.isWeighted) {
        const grams = getSelectionAmount(p);
        const current = getCartInfo(id).grams;
        const total = current + grams;
        if (total > p.stock) {
          alert("الوزن المطلوب يتجاوز الكمية المتوفرة. المتاح: " + p.stock + " جرام");
          return;
        }
        cart[id] = { isWeighted: true, grams: total };
      } else {
        const n = (Number(cart[id]) || 0) + Number(sel[id] || 1);
        if (n > p.stock) {
          alert("الكمية المطلوبة غير متوفرة حالياً. الكمية المتوفرة: " + p.stock);
          return;
        }
        cart[id] = n;
      }
      sel[id] = p.isWeighted ? { grams: Number(p.minWeight || 1000), isWeighted: true } : 1;
      save();
      render();
    }
    function render() {
      $("cats").innerHTML = CATS.map(c => `<button class="cat ${cat === c ? "on" : ""}" onclick="cat='${c}';term='';$('q').value='';render()">${c}</button>`).join("");
      const L = P.filter(match);
      let h = "";
      if (cat === "الكل" && !term) {
        const o = P.filter(p => p.old && !p.hidden).slice(0, 5);
        const n = P.filter(p => p.isNew && !p.hidden);
        h += `<h2>عروض اليوم</h2><div class="grid">${o.map(card).join("")}</div><h2>المنتجات الجديدة</h2><div class="grid">${n.map(card).join("")}</div><h2>جميع المنتجات</h2>`;
      }
      h += L.length ? `<div class="grid">${L.slice(0, lim).map(card).join("")}</div>${L.length > lim ? `<button class="big" onclick="lim += 40; render()">عرض المزيد</button>` : ""}` : `<p class="err">لم يتم العثور على منتج مطابق.</p>`;
      $("list").innerHTML = h;
      $("cn").textContent = Object.keys(cart).reduce((sum, id) => sum + (getCartInfo(id).grams || getCartInfo(id).qty || 0), 0);
      $("cn").textContent = Object.keys(cart).reduce((sum, id) => {
        const info = getCartInfo(id);
        return sum + (info.isWeighted ? info.grams : info.qty);
      }, 0);
      $("q").oninput = e => { term = e.target.value; cat = "الكل"; render(); };
    }
    function closeS() { $("ov").classList.remove("on"); }
    function sheet(h) { $("sh").innerHTML = h; $("ov").classList.add("on"); }
    function sub() {
      return Object.entries(cart).reduce((sum, [id, entry]) => sum + getCartInfo(id).itemTotal, 0);
    }
    function fee() {
      const val = $("dm") ? $("dm").value : "delivery";
      if (val !== "delivery" || sub() >= CONFIG.freeAbove) return 0;
      return CONFIG.zones[+($("zn") ? $("zn").value : 0)].f;
    }
    function upd() {
      const dl = $("dm").value === "delivery";
      $("dz").style.display = dl ? "block" : "none";
      $("tt").textContent = fm(sub() + fee());
      $("fe").textContent = fm(fee());
    }
    function openCart() {
      const ids = Object.keys(cart);
      if (!ids.length) {
        sheet(`<h2>السلة</h2><p>السلة فارغة</p><button class="big" onclick="closeS()">متابعة التسوق</button>`);
        return;
      }
      sheet(`<h2>السلة</h2>${ids.map(id => {
        const p = byId(id);
        const info = getCartInfo(id);
        return `<div class="row"><div>${p.ic} ${p.name}<br><small>${p.isWeighted ? `${info.grams} جرام · ${fm(p.price)} / كجم` : `${info.qty} × ${p.unit}`}</small></div><div><b>${fm(info.itemTotal)}</b><br><button class="cat" onclick="cc(${id},-${p.isWeighted ? (p.weightStep || 100) : 1})">−</button> <button class="cat" onclick="cc(${id},${p.isWeighted ? (p.weightStep || 100) : 1})">+</button></div></div>`;
      }).join("")}
      <div class="row tot"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div>
      <button class="big" onclick="checkout()">إتمام الطلب</button>
      <button class="cat" style="width:100%;margin-top:8px" onclick="if(confirm('تفريغ السلة؟')){cart={};save();render();closeS();}">تفريغ السلة</button>`);
    }
    function cc(i, d) {
      const p = byId(i);
      if (!p) return;
      if (p.isWeighted) {
        const current = getCartInfo(i).grams;
        const next = current + d;
        if (next <= 0) delete cart[i]; else cart[i] = { isWeighted: true, grams: next };
      } else {
        const current = Number(cart[i] || 0);
        const next = current + d;
        if (next <= 0) delete cart[i]; else cart[i] = next;
      }
      save(); render(); openCart();
    }
    function checkout() {
      sheet(`<h2>إتمام الطلب</h2>
        <div class="f">
          <label>الاسم الكامل</label><input id="nm">
          <label>رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" placeholder="09XXXXXXXX">
          <label>طريقة الاستلام</label>
          <select id="dm" onchange="upd()">${CONFIG.deliveryOn ? '<option value="delivery">توصيل للمنزل</option>' : ''}${CONFIG.pickupOn ? '<option value="pickup">استلام من المتجر</option>' : ''}</select>
          <div id="dz">
            <label>المنطقة</label><select id="zn" onchange="upd()">${CONFIG.zones.map((z, i) => `<option value="${i}">${z.n} — ${z.f} ${CONFIG.currency}</option>`).join("")}</select>
            <label>العنوان بالتفصيل</label><input id="ad">
          </div>
          <label>ملاحظات الطلب</label><textarea id="nt" rows="2"></textarea>
          <div id="er"></div>
          <div class="row"><span>المجموع الفرعي</span><span>${fm(sub())}</span></div>
          <div class="row"><span>التوصيل</span><span id="fe"></span></div>
          <div class="row tot"><span>الإجمالي النهائي</span><span id="tt"></span></div>
          <button class="big" onclick="send()">إرسال الطلب عبر واتساب</button>
        </div>`);
      upd();
      try { const m = JSON.parse(localStorage.getItem("md_me") || "null"); if (m) { $("nm").value = m.nm; $("ph").value = m.ph; $("ad").value = m.ad || ""; } } catch (e) {}
    }
    async function send() {
      const e = m => { $("er").innerHTML = `<div class="err">${m}</div>`; };
      const nm = $("nm").value.trim().replace(/[<>]/g, "");
      const ph = $("ph").value.replace(/\s/g, "");
      const dl = $("dm").value === "delivery";
      const ad = $("ad") ? $("ad").value.trim() : "";
      if (!nm || nm.length < 3) return e("الرجاء إدخال الاسم الكامل");
      if (!/^(\+?218|0)?9[1-6]\d{7}$/.test(ph)) return e("رقم الهاتف غير صحيح");
      if (dl && ad.length < 3) return e("الرجاء إدخال العنوان بالتفصيل");
      if (sub() < CONFIG.minOrder) return e("الحد الأدنى للطلب " + fm(CONFIG.minOrder));
      let no; let n = 1; try { n = (+localStorage.getItem("md_n") || 0) + 1; localStorage.setItem("md_n", n); } catch (x) {}
      no = "MD-" + String(n).padStart(6, "0");
      const z = CONFIG.zones[+($("zn") ? $("zn").value : 0)] || {};
      let m=`*طلب جديد - سوبر ماركت المدينة*\n\nرقم الطلب: #${no}\n\n*بيانات العميل:*\nالاسم: ${nm}\nالهاتف: ${ph}\n` + (dl ? `المدينة/المنطقة: ${z.n}\nالعنوان: ${ad}\n` : "") + `\nطريقة الاستلام: ${dl ? "توصيل" : "استلام من المتجر"}\n\n*المنتجات:*\n\n`;
      Object.entries(cart).forEach(([i, entry], k) => {
        const p = byId(i);
        const info = getCartInfo(i);
        if (p.isWeighted) {
          m += `${k + 1}. ${p.name}\nالوزن: ${info.grams} جرام\nسعر الوحدة: ${fm(p.price)} / كجم\nالإجمالي: ${fm(info.itemTotal)}\n\n`;
        } else {
          m += `${k + 1}. ${p.name}\nالكمية: ${info.qty}\nسعر الوحدة: ${fm(p.price)}\nالإجمالي: ${fm(info.itemTotal)}\n\n`;
        }
      });
      m += `--------------------\nالمجموع الفرعي: ${fm(sub())}\nالتوصيل: ${fm(fee())}\nالإجمالي النهائي: ${fm(sub() + fee())}\n\nملاحظات:\n${$("nt").value.trim() || "-"}\n\nشكراً لاختياركم سوبر ماركت المدينة.`;
      const url = "https://wa.me/" + CONFIG.WHATSAPP_NUMBER.replace(/\D/g, "") + "?text=" + encodeURIComponent(m);
      try { localStorage.setItem("md_me", JSON.stringify({ nm, ph, ad })); } catch (e) {}
      cart = {};
      save();
      render();
      closeS();
      window.open(url, "_blank");
      alert("تم تجهيز الطلب بنجاح. سيتم فتح واتساب الآن.");
    }
    function openAdm() {
      const form = `<div style="max-width:600px;margin:30px auto;background:#fff;padding:24px;border-radius:18px;border:1px solid var(--b)">
        <h2>إضافة منتج بالوزن</h2>
        <div class="f">
          <label>اسم المنتج</label><input id="adm_name">
          <label>سعر الكيلو</label><input id="adm_price" type="number" step="0.01">
          <label>المتاحة (جرام)</label><input id="adm_stock" type="number" step="100" min="0">
          <label>الوزن الأدنى (جرام)</label><input id="adm_min" type="number" step="50" min="100" value="250">
          <label>خطوة الزيادة (جرام)</label><input id="adm_step" type="number" step="50" min="50" value="100">
          <button class="big" onclick="saveAdmProduct()">حفظ المنتج</button>
        </div>
      </div>`;
      $("adm").innerHTML = form;
      $("adm").style.display = "block";
    }
    function saveAdmProduct() {
      const name = $("adm_name").value.trim();
      const price = Number($("adm_price").value || 0);
      const stock = Number($("adm_stock").value || 0);
      const minWeight = Number($("adm_min").value || 250);
      const step = Number($("adm_step").value || 100);
      if (!name || !price) return alert("املأ اسم المنتج وسعر الكيلو");
      const id = Math.max(0, ...P.map(p => p.id)) + 1;
      P.push({ id, name, cat: "مجمدات", price, old: 0, stock, ic: "🥩", unit: "كيلو", isNew: 0, min: 5, isWeighted: true, minWeight, weightStep: step, pricePerKg: price });
      localStorage.setItem("md_products", JSON.stringify(P));
      $("adm").style.display = "none";
      render();
      alert("تم حفظ المنتج بنجاح.");
    }
    function ftr() {
      $("ft").innerHTML = `<p>تواصل معنا | واتساب: ${CONFIG.WHATSAPP_NUMBER || "—"}</p>`;
    }
    function init() {
      const stored = JSON.parse(localStorage.getItem("md_products") || "null");
      if (stored && Array.isArray(stored) && stored.length) P = stored;
      const savedCart = JSON.parse(localStorage.getItem("md_cart") || "null");
      if (savedCart) cart = savedCart;
      try {
        if (CONFIG.WHATSAPP_NUMBER === "") CONFIG.WHATSAPP_NUMBER = "966500000000";
      } catch (e) {}
      render();
      ftr();
    }
    init();
  </script>
</body>
</html>
